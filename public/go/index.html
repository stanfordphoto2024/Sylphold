<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圍棋 19路 · 人腦 × 機器推理｜Go 19×19</title>
<meta name="description" content="Single-file Go board: real-time scoring, Chinese & Japanese-Korean rules, MCTS reasoning assistant.">
<style>
/* ============================================================
   GO 19 — design tokens & layout  (dark "sumi & kaya" theme)
   ============================================================ */
:root {
  --bg: #14110f;
  --bg-2: #1b1714;
  --panel: rgba(30, 25, 21, 0.82);
  --panel-2: rgba(38, 32, 26, 0.7);
  --stroke: rgba(226, 205, 168, 0.14);
  --stroke-2: rgba(226, 205, 168, 0.08);
  --ink: #efe6d6;
  --ink-dim: #b7a98f;
  --ink-faint: #7d715d;
  --wood: #d9a24f;
  --accent: #e0913f;
  --accent-2: #6fb3a0;
  --black-stone: #16151a;
  --white-stone: #f2eee2;
  --danger: #cf5f4e;
  --good: #7fbf7a;
  --radius: 14px;
  --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
  --ease: cubic-bezier(.22, .61, .36, 1);
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Helvetica Neue", system-ui, sans-serif;
}
:root[data-theme="light"] {
  --bg: #efe7d8;
  --bg-2: #e7dcca;
  --panel: rgba(252, 248, 240, 0.9);
  --panel-2: rgba(246, 239, 227, 0.8);
  --stroke: rgba(60, 45, 25, 0.16);
  --stroke-2: rgba(60, 45, 25, 0.09);
  --ink: #2a2118;
  --ink-dim: #6b5c47;
  --ink-faint: #98876e;
  --shadow: 0 18px 40px rgba(90, 65, 30, 0.18);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; font-family: var(--font); color: var(--ink);
  background:
    radial-gradient(1200px 800px at 15% -10%, rgba(224, 145, 63, 0.12), transparent 60%),
    radial-gradient(900px 700px at 110% 20%, rgba(111, 179, 160, 0.10), transparent 60%),
    linear-gradient(160deg, var(--bg) 0%, var(--bg-2) 100%);
  min-height: 100vh;
  letter-spacing: .01em;
  -webkit-font-smoothing: antialiased;
}
.app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }

/* ---------- header ---------- */
header {
  display: flex; align-items: center; gap: 16px; padding: 14px 22px;
  border-bottom: 1px solid var(--stroke-2);
  animation: fadeDown .5s var(--ease) both;
}
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 { font-size: 19px; margin: 0; font-weight: 650; letter-spacing: .06em; }
.brand .sub { color: var(--ink-faint); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
.spacer { flex: 1; }

/* ---------- layout ---------- */
main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(330px, .65fr); gap: 18px; padding: 18px 22px 22px; min-height: 0; }
.board-col { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 12px; min-height: 0; }
.panel-col { overflow: auto; padding-right: 4px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.panel-col::-webkit-scrollbar { width: 10px; }
.panel-col::-webkit-scrollbar-thumb { background: var(--stroke); border-radius: 20px; }

/* ---------- cards ---------- */
.card {
  background: var(--panel); border: 1px solid var(--stroke-2); border-radius: var(--radius);
  box-shadow: var(--shadow); backdrop-filter: blur(8px);
  animation: rise .5s var(--ease) both;
}
.panel-col .card:nth-child(1) { animation-delay: .05s; }
.panel-col .card:nth-child(2) { animation-delay: .11s; }
.panel-col .card:nth-child(3) { animation-delay: .17s; }
.panel-col .card:nth-child(4) { animation-delay: .23s; }
.panel-col .card:nth-child(5) { animation-delay: .29s; }
.card > .head { position: relative;
  display: flex; align-items: center; gap: 10px; padding: 13px 16px 10px;
  font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim);
}
.card > .head .sug-count { font-size: 11px; letter-spacing: .04em; color: var(--ink-faint); text-transform: none; display: inline-flex; align-items: center; gap: 6px; }
.card > .head .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
/* keep every row animation inside the card — nothing may spill over the head or the rounded edge */
.card > .body { padding: 4px 16px 16px; overflow: hidden; border-radius: 12px; }
/* the list is its own clipping box: rows may never paint over the hint above or the card edge */
#sug-list { position: relative; overflow: hidden; border-radius: 12px; padding: 2px 0 0; }

/* ---------- board ---------- */
.tray {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px; min-height: 46px;
  background: var(--panel-2); border: 1px solid var(--stroke-2); border-radius: var(--radius);
}
.tray { min-height: 34px; padding: 7px 12px; }
.tray .stones { display: flex; flex-wrap: wrap; gap: 4px; max-width: 100%; }
.mini { width: 13px; height: 13px; border-radius: 50%; box-shadow: 0 1px 2px rgba(0,0,0,.5), inset 0 1px 1px rgba(255,255,255,.25); }
.mini.b { background: radial-gradient(circle at 35% 30%, #4a4852, #111014 70%); }
.mini.w { background: radial-gradient(circle at 35% 30%, #ffffff, #cfcabb 75%); }
.board-wrap { position: relative; display: grid; place-items: center; min-height: 0; }
canvas#board {
  border-radius: 10px; box-shadow: 0 30px 70px rgba(0,0,0,.55), 0 4px 14px rgba(0,0,0,.4);
  cursor: pointer; transition: filter .3s var(--ease);
  max-width: 100%; max-height: 100%;
}
canvas#board:disabled, canvas#board.thinking { cursor: progress; }
.statusbar {
  display: flex; align-items: center; gap: 12px; padding: 10px 14px;
  background: var(--panel-2); border: 1px solid var(--stroke-2); border-radius: var(--radius);
  font-size: 13px; color: var(--ink-dim);
}
.turn-stone { width: 15px; height: 15px; border-radius: 50%; box-shadow: 0 1px 3px rgba(0,0,0,.5); }
.turn-stone.b { background: radial-gradient(circle at 35% 30%, #4a4852, #0d0c10 70%); }
.turn-stone.w { background: radial-gradient(circle at 35% 30%, #ffffff, #cfcabb 75%); }

/* ---------- score ---------- */
.score-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.score-cell { background: var(--panel-2); border: 1px solid var(--stroke-2); border-radius: 12px; padding: 12px 14px; transition: .3s var(--ease); }
.score-cell.active { border-color: rgba(224,145,63,.5); box-shadow: 0 0 0 1px rgba(224,145,63,.22), 0 8px 22px rgba(0,0,0,.3); }
.score-cell .who { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-dim); letter-spacing: .1em; text-transform: uppercase; }
.score-cell .num { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 6px; transition: .35s var(--ease); }
.score-cell .num.bump { transform: scale(1.12); }
.score-cell .rows { margin-top: 8px; display: grid; gap: 3px; font-size: 11.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.score-cell .rows div { display: flex; justify-content: space-between; gap: 10px; }
.verdict { margin-top: 12px; padding: 11px 14px; border-radius: 12px; background: linear-gradient(90deg, rgba(224,145,63,.16), rgba(224,145,63,.04));
  border: 1px solid rgba(224,145,63,.25); font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; }
.verdict small { font-weight: 500; color: var(--ink-dim); font-variant-numeric: tabular-nums; }

/* ---------- suggestions ---------- */
.sug { border: 1px solid var(--stroke-2); border-radius: 12px; padding: 11px 13px; margin-bottom: 9px; background: var(--panel-2);
  cursor: pointer; will-change: transform;
  transition: transform .2s cubic-bezier(.645,.045,.355,1), border-color .22s ease, background .22s ease, opacity .2s ease; }
/* on-screen reordering is movement → ease-in-out; entering/exiting → ease-out */
.sug.enter { animation: sugFade .22s ease both; }
.sug.leaving { opacity: 0; pointer-events: none; }
.sug.gone { display: none; }
.sug.pinned { border-color: rgba(224,145,63,.6); background: rgba(224,145,63,.07); }
.sug-top { display: flex; align-items: center; gap: 9px; }
.rank { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 12px; font-weight: 700;
  background: rgba(224,145,63,.15); color: var(--accent); flex: none; }
.sug.pinned .rank { background: var(--accent); color: #201407; }
.coord { font-weight: 700; font-size: 15px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.badge { font-size: 10.5px; padding: 3px 7px; border-radius: 20px; background: rgba(111,179,160,.14); color: var(--accent-2); letter-spacing: .06em; }
.tag { font-size: 10.5px; padding: 3px 7px; border-radius: 20px; background: rgba(226,205,168,.08); color: var(--ink-dim); }
.wr { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 650; }
.wrbar { height: 4px; border-radius: 4px; margin-top: 8px; background: rgba(226,205,168,.09); overflow: hidden; }
/* bar fills use transform, not width — width triggers layout on every live tick */
.wrbar i { display: block; height: 100%; width: 100%; transform-origin: left center; transform: scaleX(0);
  background: linear-gradient(90deg, var(--accent-2), var(--accent)); border-radius: 4px; will-change: transform;
  transition: transform .2s cubic-bezier(.645,.045,.355,1); }
.expl { margin-top: 8px; font-size: 12.5px; line-height: 1.65; color: var(--ink-dim); }
.expl b { color: var(--ink); font-weight: 600; }
.expl ul { margin: 4px 0 0; padding-left: 16px; }
.expl li { margin: 2px 0; }

/* ---------- controls ---------- */
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
.row:last-child { margin-bottom: 0; }
.row .lbl { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); min-width: 76px; }
button, select, .seg button {
  font-family: inherit; font-size: 13px; color: var(--ink); background: var(--panel-2);
  border: 1px solid var(--stroke); border-radius: 10px; padding: 8px 13px; cursor: pointer;
  transition: transform .18s var(--ease), background .2s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
}
button:hover, select:hover { border-color: rgba(224,145,63,.45); transform: translateY(-1px); }
button:active { transform: translateY(0) scale(.98); }
button.primary { background: linear-gradient(180deg, rgba(224,145,63,.9), rgba(200,124,50,.9)); color: #22160a; border-color: transparent; font-weight: 650; }
button.primary:hover { box-shadow: 0 6px 20px rgba(224,145,63,.35); }
button.ghost { background: transparent; }
button.danger:hover { border-color: rgba(207,95,78,.6); color: var(--danger); }
button.on { border-color: rgba(224,145,63,.6); background: rgba(224,145,63,.14); }
button.mini-btn { padding: 6px 10px; font-size: 12px; }
.seg { display: flex; gap: 6px; background: rgba(0,0,0,.18); padding: 4px; border-radius: 12px; border: 1px solid var(--stroke-2); }
.seg button { border: none; background: transparent; padding: 7px 12px; font-size: 12.5px; }
.seg button.on { background: rgba(224,145,63,.9); color: #22160a; font-weight: 650; }
select { padding: 8px 10px; }
kbd { font: inherit; font-size: 11px; background: rgba(0,0,0,.25); border: 1px solid var(--stroke); padding: 1px 6px; border-radius: 6px; }

/* ---------- log ---------- */
.log { max-height: 200px; overflow: auto; font-size: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; font-variant-numeric: tabular-nums; }
.log div { display: flex; gap: 8px; padding: 3px 6px; border-radius: 6px; }
.log div:hover { background: rgba(226,205,168,.06); }
.log .n { color: var(--ink-faint); min-width: 26px; }
.log .c { font-weight: 650; }
.rules-body { font-size: 12.5px; line-height: 1.75; color: var(--ink-dim); }
.rules-body h4 { margin: 12px 0 4px; color: var(--ink); font-size: 13px; letter-spacing: .04em; }
.rules-body ul { margin: 4px 0; padding-left: 18px; }
.rules-body li { margin: 2px 0; }
.rules-body .k { color: var(--accent); font-weight: 600; }

/* ---------- toast & misc ---------- */
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0;
  background: rgba(20,17,15,.92); border: 1px solid var(--stroke); color: var(--ink); padding: 12px 20px; border-radius: 12px;
  font-size: 13.5px; box-shadow: var(--shadow); transition: .35s var(--ease); pointer-events: none; z-index: 50; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.thinking-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse 1s infinite var(--ease); }
@keyframes pulse { 0%,100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.25); } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
.hide { display: none !important; }
.muted { color: var(--ink-faint); }
.mono { font-variant-numeric: tabular-nums; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-dim); cursor: pointer; }
.switch input { appearance: none; width: 34px; height: 19px; border-radius: 20px; background: rgba(226,205,168,.14); position: relative; cursor: pointer; transition: .25s var(--ease); }
.switch input::after { content: ""; position: absolute; width: 15px; height: 15px; border-radius: 50%; top: 2px; left: 2px; background: var(--ink-dim); transition: .25s var(--ease); }
.switch input:checked { background: rgba(224,145,63,.5); }
.switch input:checked::after { left: 17px; background: var(--accent); }

@media (max-width: 1080px) {
  /* single-column flow so nothing gets clipped: board, trays and status all stay visible */
  .app { height: auto; min-height: 100vh; }
  main { display: block; }
  .board-col { display: block; }
  .board-col > * + * { margin-top: 12px; }
  .board-wrap { width: min(94vw, 62vh); aspect-ratio: 1 / 1; margin: 4px auto 0; }
  .panel-col { margin-top: 16px; overflow: visible; }
  header { flex-wrap: wrap; gap: 10px; }
  header .spacer { flex: 1 1 auto; }
}

/* ---------- hover / motion preferences ---------- */
@media (hover: hover) and (pointer: fine) {
  .sug:hover { transform: translateY(-2px); border-color: rgba(224,145,63,.35); }
}
@media (prefers-reduced-motion: reduce) {
  /* keep opacity / colour changes, drop movement */
  .sug { transition: opacity .2s ease, border-color .2s ease, background .2s ease; }
  .sug.enter { animation: none; }
  .sug:hover { transform: none; }
  .sug { transform: none !important; }
  .wrbar i { transition: opacity .2s ease; }
  .sug.enter, .sug.leaving { transform: none; }
}

@keyframes sugFade { from { opacity: 0; } to { opacity: 1; } }

</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <h1 id="app-title">圍棋 · 19路</h1>
      <span class="sub" id="app-sub">單一網頁</span>
    </div>
    <div class="spacer"></div>
    <button id="lang-toggle" class="ghost" title="Language">EN</button>
  </header>
  <main>
    <section class="board-col">
      <div class="tray" id="tray-ai"><span class="stones"></span></div>
      <div class="board-wrap"><canvas id="board"></canvas></div>
      <div class="tray" id="tray-you"><span class="stones"></span></div>
      <div class="statusbar" id="status"></div>
    </section>
    <aside class="panel-col">
      <div class="card" id="card-score">
        <div class="head"><span class="dot"></span><span id="lbl-score">Score</span></div>
        <div class="body">
          <div class="row">
            <span class="lbl" id="lbl-ruleset">Scoring</span>
            <div class="seg"><button id="seg-cn" class="on">Chinese</button><button id="seg-jp">JP/KR</button></div>
          </div>
          <div class="score-grid">
            <div class="score-cell active" id="sc-b">
              <div class="who"><span class="turn-stone b"></span><span id="sc-b-who">Black</span></div>
              <div class="num">0</div><div class="rows"></div>
            </div>
            <div class="score-cell" id="sc-w">
              <div class="who"><span class="turn-stone w"></span><span id="sc-w-who">White</span></div>
              <div class="num">0</div><div class="rows"></div>
            </div>
          </div>
          <div class="verdict" id="verdict"><span>—</span></div>
          <p class="muted" style="font-size:12px;margin:10px 2px 0" id="marks-hint"></p>
          <div class="row" style="margin-top:10px">
            <button id="btn-autodetect" class="mini-btn">Auto</button>
            <button id="btn-clearmarks" class="mini-btn ghost">Clear</button>
          </div>
        </div>
      </div>

      <div class="card" id="card-sug">
        <div class="head"><span class="dot"></span><span id="lbl-sug">Suggestions</span><span class="spacer"></span><span class="sug-count" id="sug-count"></span><button id="btn-resuggest" class="mini-btn ghost" style="padding:4px 9px">↻</button></div>
        <div class="body">
          <p class="muted" id="sug-hint" style="font-size:12px;margin:2px 2px 10px"></p>
          <div id="sug-list"></div>
        </div>
      </div>

      <div class="card" id="card-ctl">
        <div class="head"><span class="dot"></span><span id="lbl-ctl">Controls</span></div>
        <div class="body">
          <div class="row">
            <button id="btn-new" class="primary"></button>
            <button id="btn-undo"></button>
            <button id="btn-resign" class="danger ghost"></button>
            <button id="btn-end" class="ghost"></button>
          </div>
          <div class="row"><span class="lbl" id="lbl-you">You play</span>
            <div class="seg"><button id="you-black" class="on">● </button><button id="you-white">○ </button></div>
          </div>
          <div class="row"><span class="lbl" id="lbl-size">Board</span>
            <select id="sel-size"><option value="19" selected>19×19</option><option value="13">13×13</option><option value="9">9×9</option></select>
            <span class="lbl" id="lbl-strength" style="min-width:0">AI</span>
            <select id="sel-strength">
              <option value="1200">快 · 1.2秒</option><option value="3000" selected>標準 · 3秒</option>
              <option value="6000">強 · 6秒</option><option value="12000">最強 · 12秒</option>
            </select>
          </div>
          <div class="row"><label class="switch" id="sw-overlay"><input type="checkbox" checked><span></span></label>
            <label class="switch" id="sw-sound"><input type="checkbox" checked><span></span></label>
            <label class="switch" id="sw-auto"><input type="checkbox" checked><span></span></label>
            <label class="switch" id="sw-suicide"><input type="checkbox"><span></span></label>
          </div>
        </div>
      </div>

      <div class="card" id="card-log">
        <div class="head"><span class="dot"></span><span id="lbl-log">Log</span></div>
        <div class="body"><div class="log" id="log"></div></div>
      </div>

    </aside>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
/* =====================================================================
   GO ENGINE CORE  (pure logic · DOM-free · node-testable)
   Rules: Tromp–Taylor / Chinese (area scoring, positional superko) and
   Japanese/Korean (territory scoring, simple ko) — switchable.
   Life & death: iterative region analysis with false-eye + seki handling.
   ===================================================================== */
'use strict';

const EMPTY = 0, BLACK = 1, WHITE = 2;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* =====================================================================
   Game
   ===================================================================== */
class Game {
  constructor(opts) {
    opts = opts || {};
    this.n = opts.size || 19; this.N = this.n * this.n;
    this.adj = new Int32Array(this.N * 4); this.adj.fill(-1);
    this.diag = new Int32Array(this.N * 4); this.diag.fill(-1);
    for (let r = 0; r < this.n; r++) for (let c = 0; c < this.n; c++) {
      const p = r * this.n + c; let k = 0;
      if (r > 0) this.adj[p * 4 + k++] = p - this.n;
      if (r < this.n - 1) this.adj[p * 4 + k++] = p + this.n;
      if (c > 0) this.adj[p * 4 + k++] = p - 1;
      if (c < this.n - 1) this.adj[p * 4 + k++] = p + 1;
      const d = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
      for (let i = 0; i < 4; i++) { const rr = r + d[i][0], cc = c + d[i][1];
        this.diag[p * 4 + i] = (rr >= 0 && cc >= 0 && rr < this.n && cc < this.n) ? rr * this.n + cc : -1; }
    }
    const rnd = mulberry32(opts.seed || 0x9E3779B9);
    this.z1 = new Uint32Array(this.N * 3); this.z2 = new Uint32Array(this.N * 3);
    for (let i = 0; i < this.N * 3; i++) { this.z1[i] = (rnd() * 4294967296) >>> 0; this.z2[i] = (rnd() * 4294967296) >>> 0; }
    this.rules = {
      koMode: opts.koMode || 'psk',       // 'psk' = positional superko (Chinese/Tromp-Taylor) | 'simple' = simple ko (JP/KR)
      suicide: !!opts.suicide,            // false = Japanese/Chinese/Korean, true = NZ/Tromp-Taylor variant
      scoring: opts.scoring || 'area',    // 'area' (Chinese) | 'territory' (Japanese/Korean)
      komi: opts.komi == null ? 7.5 : opts.komi,
    };
    this._stack = new Int32Array(this.N); this._seen = new Uint8Array(this.N);
    this.reset();
  }
  reset() {
    this.board = new Uint8Array(this.N);
    this.h1 = 0; this.h2 = 0; this.hist = new Map(); this.histSeq = [];
    this._addHash();
    this.toMove = BLACK; this.moveNum = 0; this.stack = []; this.passes = 0;
    this.koPoint = -1; this.capturedBy = [0, 0, 0]; this.lastMove = -1; this.over = null;
    this.deadMarks = new Set();

<script>
/* =====================================================================
   APP — renderer, panels, game flow
   ===================================================================== */
(function () {
  'use strict';
  const gEngine = window.__GO_ENGINE__;
  const { Game, MCTS, BLACK, WHITE, EMPTY, tacticalFeatures } = gEngine;
  const COLS = 'ABCDEFGHJKLMNOPQRST';

  const S = {
    lang: 'zh', theme: 'dark',
    size: 19, komiCN: 7.5, komiJP: 6.5,
    scoring: 'area',            // 'area' (Chinese) | 'territory' (JP/KR)
    suicide: false, koMode: 'psk',
    youColor: BLACK, strength: 3000, visitsCap: 20000, aiDelay: 260,
    overlay: true, sound: true, autoSuggest: true,
    game: null, marks: new Set(),
    suggestions: [], pinned: null, previewPoint: null, previewResult: null,
    hover: -1, anims: [], thinking: false, analyzing: false, busy: false,
    log: [], lastAnalyze: null, aiSeed: 1,
  };
  const t = (k, ...a) => { const d = I18N[S.lang]; let v = d; for (const p of k.split('.')) v = v && v[p]; return typeof v === 'function' ? v(...a) : (v == null ? k : v); };
  const coordName = p => p < 0 ? '—' : COLS[p % S.size] + (S.size - Math.floor(p / S.size));

  /* ---------------- DOM ---------------- */
  const $ = s => document.querySelector(s);
  const canvas = $('#board'), ctx = canvas.getContext('2d');
  let DPR = Math.max(1, window.devicePixelRatio || 1);
  let cell = 32, pad = 34, boardPx = 640;
  let woodCanvas = null, sprites = {};

  /* ---------------- wood board texture ---------------- */
  function buildWood() {
    const c = document.createElement('canvas');
    c.width = boardPx * DPR; c.height = boardPx * DPR;
    const x = c.getContext('2d'); x.scale(DPR, DPR);
    const rnd = mulberrySeed(7717);
    const base = S.theme === 'dark' ? ['#c8933f', '#b8823a', '#d3a054'] : ['#e3bd78', '#d8b06a', '#e8c684'];
    const g = x.createLinearGradient(0, 0, boardPx * .6, boardPx);
    g.addColorStop(0, base[2]); g.addColorStop(.5, base[0]); g.addColorStop(1, base[1]);
    x.fillStyle = g; x.fillRect(0, 0, boardPx, boardPx);
    /* grain: long wavy vertical strokes */
    for (let i = 0; i < 260; i++) {
      const x0 = rnd() * boardPx, w = .4 + rnd() * 2.2, a = .012 + rnd() * .05;
      const dark = rnd() > .45;
      x.strokeStyle = dark ? `rgba(90,55,15,${a})` : `rgba(255,225,170,${a * .8})`;
      x.lineWidth = w; x.beginPath();
      let px = x0;
      x.moveTo(px, -10);
      for (let y = -10; y <= boardPx + 10; y += 22) { px += (rnd() - .5) * 3.2; x.lineTo(px, y); }
      x.stroke();
    }
    /* fine noise */
    for (let i = 0; i < 2600; i++) {
      const px = rnd() * boardPx, py = rnd() * boardPx, a = .01 + rnd() * .035;
      x.fillStyle = rnd() > .5 ? `rgba(70,40,10,${a})` : `rgba(255,235,190,${a})`;
      x.fillRect(px, py, 1 + rnd() * 2, 1 + rnd());
    }
    /* occasional knot rings */
    for (let i = 0; i < 3; i++) {
      const kx = rnd() * boardPx, ky = rnd() * boardPx, R = 10 + rnd() * 22;
      for (let r = R; r > 2; r -= 3.2) {
        x.strokeStyle = `rgba(96,58,18,${.025 + rnd() * .03})`; x.lineWidth = 1.2;
        x.beginPath(); x.ellipse(kx, ky, r, r * (.6 + rnd() * .3), .3, 0, 7); x.stroke();
      }
    }
    /* light from top-left + vignette */
    const lg = x.createRadialGradient(boardPx * .28, boardPx * .2, boardPx * .1, boardPx * .5, boardPx * .5, boardPx * .8);
    lg.addColorStop(0, 'rgba(255,240,200,.10)'); lg.addColorStop(.6, 'rgba(255,240,200,0)'); lg.addColorStop(1, 'rgba(40,20,0,.22)');
    x.fillStyle = lg; x.fillRect(0, 0, boardPx, boardPx);
    woodCanvas = c;
  }
  function mulberrySeed(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  /* ---------------- stone sprites (with baked shadow) ---------------- */
  function buildSprites() {
    sprites = {};
    const r = cell * .465, size = Math.ceil((r * 2 + 10) * DPR);
    for (const col of [BLACK, WHITE]) {
      const c = document.createElement('canvas'); c.width = c.height = size;
      const x = c.getContext('2d'); x.scale(DPR, DPR);
      const cx = size / (2 * DPR), cy = size / (2 * DPR);
      /* shadow */
      x.save(); x.shadowColor = 'rgba(0,0,0,.55)'; x.shadowBlur = cell * .22; x.shadowOffsetY = cell * .10;
      x.fillStyle = 'rgba(0,0,0,.85)'; x.beginPath(); x.arc(cx, cy, r * .98, 0, 7); x.fill(); x.restore();
      /* body */
      const g = x.createRadialGradient(cx - r * .38, cy - r * .45, r * .12, cx, cy, r * 1.06);
      if (col === BLACK) { g.addColorStop(0, '#5a5a66'); g.addColorStop(.35, '#26262e'); g.addColorStop(1, '#05050a'); }
      else { g.addColorStop(0, '#ffffff'); g.addColorStop(.4, '#f4f0e4'); g.addColorStop(1, '#c8c2ae'); }
      x.fillStyle = g; x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
      /* rim shade */
      x.lineWidth = Math.max(.6, r * .07);
      x.strokeStyle = col === BLACK ? 'rgba(0,0,0,.55)' : 'rgba(120,110,85,.35)';
      x.beginPath(); x.arc(cx, cy, r * .97, 0, 7); x.stroke();
      /* specular */
      x.save(); x.globalAlpha = col === BLACK ? .30 : .55;
      const sg = x.createRadialGradient(cx - r * .4, cy - r * .48, 0, cx - r * .4, cy - r * .48, r * .55);
      sg.addColorStop(0, 'rgba(255,255,255,.95)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = sg; x.beginPath(); x.arc(cx - r * .34, cy - r * .4, r * .5, 0, 7); x.fill(); x.restore();
      sprites[col] = c;
    }
  }

  /* ---------------- geometry ---------------- */
  function layout() {
    const wrap = $('.board-wrap');
    const avail = Math.min(wrap.clientWidth, wrap.clientHeight) || 520;
    boardPx = Math.max(320, Math.floor(avail));
    pad = Math.max(22, Math.round(boardPx * (S.size >= 19 ? .052 : .07)));
    cell = (boardPx - pad * 2) / (S.size - 1 + 1);      /* grid spans pad..boardPx-pad */
    cell = (boardPx - pad * 2) / S.size;
    const real = (boardPx - pad * 2) / (S.size - 1);
    cell = real;
    canvas.style.width = boardPx + 'px'; canvas.style.height = boardPx + 'px';
    canvas.width = boardPx * DPR; canvas.height = boardPx * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildWood(); buildSprites();
  }
  const px = p => [pad + (p % S.size) * cell, pad + Math.floor(p / S.size) * cell];

  /* ---------------- draw ---------------- */
  let overlayAlpha = 0, overlayTarget = 0;
  function draw() {
    const g = S.game; if (!g || !woodCanvas) return;
    ctx.clearRect(0, 0, boardPx, boardPx);
    ctx.drawImage(woodCanvas, 0, 0, boardPx, boardPx);
    /* grid */
    const n = S.size, inset = pad + cell * (n - 1) / (n) * 0;
    const step = cell;
    const x0 = pad, y0 = pad, x1 = pad + (n - 1) * step, y1 = pad + (n - 1) * step;
    ctx.strokeStyle = S.theme === 'dark' ? 'rgba(20,12,4,.75)' : 'rgba(40,25,8,.62)';
    ctx.lineWidth = 1;
    for (let i = 0; i < n; i++) {
      const off = (i === 0 || i === n - 1) ? .5 : 0;
      ctx.lineWidth = (i === 0 || i === n - 1) ? 1.6 : 1;
      ctx.beginPath(); ctx.moveTo(x0, y0 + i * step + off); ctx.lineTo(x1, y0 + i * step + off); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x0 + i * step + off, y0); ctx.lineTo(x0 + i * step + off, y1); ctx.stroke();
    }
    /* hoshi */
    const hs = n === 19 ? [3, n - 4] : n === 13 ? [3, 6, n - 4] : n === 9 ? [2, 6] : [];
    const hpts = n === 19 ? [[3, 3], [3, 9], [3, 15], [9, 3], [9, 9], [9, 15], [15, 3], [15, 9], [15, 15]]
      : n === 13 ? [[3, 3], [3, 9], [9, 3], [9, 9], [6, 6]] : n === 9 ? [[2, 2], [2, 6], [6, 2], [6, 6], [4, 4]] : [];
    ctx.fillStyle = S.theme === 'dark' ? 'rgba(15,9,3,.85)' : 'rgba(35,22,8,.75)';
    for (const [r, c] of hpts) { ctx.beginPath(); ctx.arc(pad + c * step, pad + r * step, Math.max(2.2, cell * .10), 0, 7); ctx.fill(); }
    /* coordinates */
    ctx.fillStyle = 'rgba(236,222,196,.42)';
    if (S.theme === 'light') ctx.fillStyle = 'rgba(60,40,15,.5)';
    ctx.font = `${Math.max(8, Math.round(cell * .34))}px ${getComputedStyle(document.body).fontFamily}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let i = 0; i < n; i++) {
      ctx.fillText(COLS[i], pad + i * step, pad / 2 - 1);
      ctx.fillText(COLS[i], pad + i * step, boardPx - pad / 2 + 1);
      ctx.fillText(String(n - i), pad / 2 - 1, pad + i * step);
      ctx.fillText(String(n - i), boardPx - pad / 2 + 1, pad + i * step);
    }
    /* territory overlay */
    if (S.overlay && S.lastAnalyze && overlayAlpha > .01) {
      const a = S.lastAnalyze;
      ctx.save(); ctx.globalAlpha = overlayAlpha;
      const r = cell * .22;
      for (let p = 0; p < n * n; p++) {
        let o = a._draw[p]; if (!o) continue;
        const [X, Y] = px(p);
        ctx.fillStyle = o === BLACK ? 'rgba(15,12,10,.85)' : 'rgba(246,242,230,.9)';
        ctx.beginPath(); ctx.arc(X, Y, r, 0, 7); ctx.fill();
      }
      ctx.restore();
    }
    /* stones */
    const now = performance.now();
    const anim = new Map();
    for (const a of S.anims) anim.set(a.p, a);
    for (let p = 0; p < n * n; p++) {
      const c = g.board[p]; if (!c) continue;
      let scale = 1, alpha = 1;
      if (anim.has(p)) { const a = anim.get(p); const k = Math.min(1, (now - a.t0) / 190);
        const e = 1 - Math.pow(1 - k, 3); scale = .72 + .28 * e + Math.sin(k * Math.PI) * .06; alpha = k;
        if (k >= 1) S.anims.splice(S.anims.indexOf(a), 1); }
      drawStone(p, c, scale, alpha);
    }
    /* dead marks */
    if (S.marks.size) {
      ctx.save(); ctx.strokeStyle = 'rgba(207,95,78,.95)'; ctx.lineWidth = Math.max(1.6, cell * .09);
      for (const p of S.marks) { if (!g.board[p]) continue; const [X, Y] = px(p); const r = cell * .3;
        ctx.beginPath(); ctx.moveTo(X - r, Y - r); ctx.lineTo(X + r, Y + r); ctx.moveTo(X + r, Y - r); ctx.lineTo(X - r, Y + r); ctx.stroke(); }
      ctx.restore();
    }
    /* preview ghost */
    if (S.previewPoint != null && S.previewPoint >= 0) {
      const [X, Y] = px(S.previewPoint);
      ctx.save(); ctx.globalAlpha = .55;
      ctx.fillStyle = 'rgba(224,145,63,.28)'; ctx.beginPath(); ctx.arc(X, Y, cell * .46, 0, 7); ctx.fill();
      ctx.strokeStyle = 'rgba(224,145,63,.95)'; ctx.lineWidth = 2; ctx.setLineDash([4, 3]);
      ctx.beginPath(); ctx.arc(X, Y, cell * .46, 0, 7); ctx.stroke(); ctx.restore();
    }
    /* suggestion pins */
    S.suggestions.slice(0, 5).forEach((s, i) => {
      if (s.p < 0) return;
      const [X, Y] = px(s.p);
      ctx.save();
      ctx.globalAlpha = S.pinned === s.p ? 1 : .8;
      ctx.fillStyle = S.pinned === s.p ? 'rgba(224,145,63,.95)' : 'rgba(224,145,63,.55)';
      ctx.beginPath(); ctx.arc(X, Y, cell * (S.pinned === s.p ? .34 : .3), 0, 7); ctx.fill();
      ctx.fillStyle = '#22160a'; ctx.font = `700 ${Math.round(cell * .34)}px ${getComputedStyle(document.body).fontFamily}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(String(i + 1), X, Y + .5);
      ctx.restore();
    });
    /* ko point marker */
    if (g.koPoint >= 0) { const [X, Y] = px(g.koPoint);
      ctx.save(); ctx.strokeStyle = 'rgba(224,145,63,.8)'; ctx.lineWidth = 1.6; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(X, Y, cell * .3, 0, 7); ctx.stroke(); ctx.restore(); }
    /* last move ring */
    if (g.lastMove >= 0) {
      const [X, Y] = px(g.lastMove);
      ctx.save(); ctx.strokeStyle = g.board[g.lastMove] === BLACK ? 'rgba(240,235,225,.9)' : 'rgba(20,16,12,.85)';
      ctx.lineWidth = Math.max(1.4, cell * .07); ctx.beginPath(); ctx.arc(X, Y, cell * .22, 0, 7); ctx.stroke(); ctx.restore();
    }
    /* hover ghost */
    if (S.hover >= 0 && !S.busy && S.game.board[S.hover] === EMPTY && S.game.isLegal(S.hover)) {
      drawStone(S.hover, S.game.toMove, .96, .38, true);
    }
    if (S.anims.length || Math.abs(overlayAlpha - overlayTarget) > .01) requestAnimationFrame(draw);
  }
  function drawStone(p, color, scale, alpha, ghost) {
    const sp = sprites[color]; if (!sp) return;
    const [X, Y] = px(p);
    ctx.save(); ctx.globalAlpha = alpha;
    const size = sp.width / DPR * scale;
    ctx.drawImage(sp, X - size / 2, Y - size / 2, size, size);
    ctx.restore();
  }

  /* ---------------- sound ---------------- */
  let AC = null;
  function click(color) {
    if (!S.sound) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      const now = AC.currentTime;
      const buf = AC.createBuffer(1, 2048, AC.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.2);
      const src = AC.createBufferSource(); src.buffer = buf;
      const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = color === BLACK ? 2100 : 1500; f.Q.value = 1.1;
      const gain = AC.createGain(); gain.gain.value = .32;
      src.connect(f); f.connect(gain); gain.connect(AC.destination); src.start(now);
      const o = AC.createOscillator(), og = AC.createGain();
      o.frequency.value = color === BLACK ? 220 : 170; o.type = 'sine';
      og.gain.setValueAtTime(.14, now); og.gain.exponentialRampToValueAtTime(.001, now + .09);
      o.connect(og); og.connect(AC.destination); o.start(now); o.stop(now + .1);
    } catch (e) { }
  }

  /* =====================================================================
     GAME FLOW
     ===================================================================== */
  const aiColor = () => S.youColor === BLACK ? WHITE : BLACK;
  function newGame() {
    S.game = new Game({ size: S.size, komi: S.scoring === 'area' ? S.komiCN : S.komiJP, suicide: S.suicide, koMode: S.koMode });
    S.marks = new Set(); S.suggestions = []; S.pinned = null; S.previewPoint = null; S.log = []; S.anims = [];
    S.game.deadMarks = S.marks;
    renderLog(); refreshScore(); renderSuggestions(); setStatus();
    if (S.game.toMove === aiColor()) setTimeout(aiMove, 420);
  }
  async function humanPlay(p) {
    if (S.busy || S.thinking) return;
    if (S.game.over) { toggleMark(p); return; }
    if (S.game.toMove !== S.youColor) return;
    const mv = S.game.tryPlay(p); if (!mv) return;
    S.game.play(p, mv); S.anims.push({ p, t0: performance.now() }); click(S.youColor);
    pushLog(S.youColor, p);
    S.pinned = null; S.previewPoint = null;
    refreshScore(); setStatus(); renderLog(); requestAnimationFrame(draw); maybeSuggest();
    if (!S.game.over) setTimeout(aiMove, S.aiDelay);
  }
  async function aiMove() {
    if (S.game.over || S.game.toMove !== aiColor()) return;
    S.busy = true; S.thinking = true; setStatus(); canvas.classList.add('thinking'); requestAnimationFrame(draw);
    const m = new MCTS(S.game, { rolloutCap: S.size >= 19 ? 110 : 70, rootChildren: 34, children: 16, c: 1.25 });
    m.reset(aiColor(), S.aiSeed++);
    await m.run(S.visitsCap, null, 10, S.strength);   /* strength = thinking time in ms */
    const best = m.stats().top[0];
    S.busy = false; S.thinking = false; canvas.classList.remove('thinking');
    if (!best) { S.game.pass(); pushLog(aiColor(), -1); }
    else { const mv = S.game.tryPlay(best.p); if (mv) { S.game.play(best.p, mv); S.anims.push({ p: best.p, t0: performance.now() }); click(aiColor()); pushLog(aiColor(), best.p); } }
    S.previewPoint = null;
    refreshScore(); setStatus(); renderLog(); renderSuggestions(); requestAnimationFrame(draw); maybeSuggest();
  }

  function undoMove() {
    /* undo until it is the human's turn again */
    let n = 0;
    while (S.game.stack.length && n < 2) { S.game.undo(); n++; if (S.game.toMove === S.youColor) break; }
    S.pinned = null; S.previewPoint = null; S.suggestions = [];
    refreshScore(); renderLog(); setStatus(); renderSuggestions(); requestAnimationFrame(draw); maybeSuggest();
  }
  function toggleMark(p) {
    const g = S.game; if (!g.board[p]) return;
    const grp = g.groupOf(p); if (!grp) return;
    const already = grp.stones.some(s => S.marks.has(s));
    for (const s of grp.stones) { if (already) S.marks.delete(s); else S.marks.add(s); }
    refreshScore(); requestAnimationFrame(draw);
  }

  /* =====================================================================
     SCORE PANEL  — during play: live influence estimate; at end: real count
     ===================================================================== */
  function influenceOwner() {
    const n = S.size, N = n * n, g = S.game;
    const db = new Int32Array(N).fill(-1), dw = new Int32Array(N).fill(-1);
    const q = [];
    for (let p = 0; p < N; p++) if (g.board[p] === BLACK) { db[p] = 0; q.push(p); }
    let head = 0;
    while (head < q.length) { const p = q[head++], d = db[p] + 1;
      for (let k = 0; k < 4; k++) { const a = g.adj[p * 4 + k]; if (a < 0) continue;
        if (g.board[a] === EMPTY && db[a] < 0) { db[a] = d; q.push(a); } } }
    const q2 = [];
    for (let p = 0; p < N; p++) if (g.board[p] === WHITE) { dw[p] = 0; q2.push(p); }
    head = 0;
    while (head < q2.length) { const p = q2[head++], d = dw[p] + 1;
      for (let k = 0; k < 4; k++) { const a = g.adj[p * 4 + k]; if (a < 0) continue;
        if (g.board[a] === EMPTY && dw[a] < 0) { dw[a] = d; q2.push(a); } } }
    const owner = new Uint8Array(N);
    for (let p = 0; p < N; p++) {
      if (g.board[p]) { owner[p] = g.board[p]; continue; }
      const b = db[p] < 0 ? 99 : db[p], w = dw[p] < 0 ? 99 : dw[p];
      if (b + 1 < w && b <= 6) owner[p] = BLACK; else if (w + 1 < b && w <= 6) owner[p] = WHITE;
    }
    return owner;
  }
  function refreshScore() {
    if (!S.game) return;
    const a = S.game.analyze(S.marks);
    S.lastAnalyze = a; overlayTarget = S.overlay ? 1 : 0;
    const live = !S.game.over && !S.marks.size;
    const active = S.scoring, other = S.scoring === 'area' ? 'territory' : 'area';
    let sa = a.score[active], so = a.score[other];
    if (live) {
      const inf = influenceOwner();
      let ib = 0, iw = 0;
      for (let p = 0; p < S.size * S.size; p++) { if (inf[p] === BLACK) ib++; else if (inf[p] === WHITE) iw++; }
      sa = { B: ib + (active === 'territory' ? S.game.capturedBy[BLACK] : 0), W: iw + (active === 'territory' ? S.game.capturedBy[WHITE] : 0) + sa.komi,
        rawB: ib, rawW: iw, komi: sa.komi, terrB: ib, terrW: iw, prisB: S.game.capturedBy[BLACK], prisW: S.game.capturedBy[WHITE], dame: 0, deadB: 0, deadW: 0 };
      sa.leader = sa.B > sa.W ? 'B' : sa.W > sa.B ? 'W' : 'draw';
      so = { ...so };
    }
    a._draw = live ? influenceOwner() : a.owner;
    $('#sc-b .num').textContent = fmt(sa.B); $('#sc-w .num').textContent = fmt(sa.W);
    $('#sc-b .rows').innerHTML = scoreRows(sa, 'B');
    $('#sc-w .rows').innerHTML = scoreRows(sa, 'W');
    let v;
    const estTag = live ? `<small>${S.lang === 'zh' ? '動態預估' : 'live estimate'}</small>` : '';
    if (S.game.over && S.game.over.type === 'resign') {
      v = (S.game.over.winner === BLACK ? t('winnerB') : t('winnerW')) + ' ' + t('byResign');
    } else if (S.game.over) {
      v = (sa.leader === 'B' ? t('winnerB') : sa.leader === 'W' ? t('winnerW') : t('draw')) + ' ' + t('byCount') +
        ` · ${fmt(sa.B)}–${fmt(sa.W)}`;
      if (other === 'territory' || other === 'area') v += `  ‖ ${other === 'area' ? t('segChinese') : t('segJapKr')} ${fmt(so.B)}–${fmt(so.W)}`;
      if (so.leader !== sa.leader) v += ` (${other === 'area' ? t('segChinese') : t('segJapKr')}: ${fmt(so.B)}–${fmt(so.W)})`;
    } else {
      const l = sa.leader;
      v = (l === 'draw' ? t('draw') : (l === 'B' ? t('winnerB') : t('winnerW')) + ' ' + t('byCount')) +
        ` · ${fmt(sa.B)}–${fmt(sa.W)}`;
    }
    $('#verdict').innerHTML = `<span>${v}</span>${estTag || `<small>${t('komiLabel')} ${fmt(sa.komi)}</small>`}`;
    renderTrayStones('#tray-you', S.youColor); renderTrayStones('#tray-ai', aiColor());
    requestAnimationFrame(draw);
  }
  function renderTrayStones(sel, capturer) {
    /* pure icon strip: each mini stone is a stone that `capturer` took, shown in the colour it had */
    const el = $(sel), box = el.querySelector('.stones');
    const n = S.game.capturedBy[capturer];
    el.style.display = n ? '' : 'none';
    el.title = t(capturer === S.youColor ? 'youCaptured' : 'aiCaptured') + ' · ' + n;
    box.innerHTML = '';
    for (let i = 0; i < Math.min(n, 80); i++) { const d = document.createElement('i');
      d.className = 'mini ' + (capturer === BLACK ? 'w' : 'b'); box.appendChild(d); }
  }
  function scoreRows(s, side) {
    if (s.terrB === undefined) {   /* area */
      return `<div><span>${t('stonesLabel')}+${t('territoryLabel')}</span><span class="mono">${fmt(side === 'B' ? s.rawB : s.rawW)}</span></div>
        <div><span>${t('dameLabel')}</span><span class="mono">${fmt(s.dame)}</span></div>
        <div><span>${t('komiLabel')}</span><span class="mono">${side === 'B' ? '—' : fmt(s.komi)}</span></div>`;
    }
    const terr = side === 'B' ? s.terrB : s.terrW, pris = side === 'B' ? s.prisB : s.prisW;
    return `<div><span>${t('territoryLabel')}</span><span class="mono">${fmt(terr)}</span></div>
      <div><span>${t('prisonersLabel')}</span><span class="mono">${fmt(pris)}</span></div>
      <div><span>${t('komiLabel')}</span><span class="mono">${side === 'B' ? '—' : fmt(s.komi)}</span></div>`;
  }
  const fmt = n => (Math.round(n * 2) / 2).toString().replace(/\.0$/, '');

  /* =====================================================================
     SUGGESTIONS (visual reasoning tool)
     ===================================================================== */
  let suggestToken = 0, lastSugRender = 0;
  async function runSuggestions(manual) {
    const token = ++suggestToken;
    const color = S.youColor;
    S.analyzing = true; setStatus(); renderSuggestions();
    const msBudget = Math.min(S.strength * 2, 9000);   /* the panel may keep thinking a little longer */
    const m = new MCTS(S.game, { rolloutCap: S.size >= 19 ? 90 : 60, rootChildren: 22, children: 12, c: 1.3, noise: .25 });
    m.reset(color, 991 + S.game.moveNum * 7);
    /* live pass — results stream in as the search grows */
    const onProgress = () => {
      if (token !== suggestToken) return;
      const now = performance.now();
      if (now - lastSugRender < 220) return;
      lastSugRender = now;
      const st = m.stats(); st.top.sort((a, b) => (b.n - a.n) || (b.wr - a.wr));
      S.suggestions = st.top.slice(0, 5).map(x => ({ p: x.p, n: x.n, wr: x.wr, f: tacticalFeatures(S.game, x.p, color), live: true }));
      renderSuggestions();
    };
    const stats = await m.run(S.visitsCap, onProgress, 10, msBudget);
    if (token !== suggestToken) return;
    stats.top.sort((a, b) => (b.n - a.n) || (b.wr - a.wr));
    S.analyzing = false;
    const base = S.lastAnalyze ? S.lastAnalyze.score[S.scoring] : null;
    const list = [];
    for (const top of stats.top.slice(0, 5)) {
      const f = tacticalFeatures(S.game, top.p, color);
      if (!f) continue;
      /* territory delta — evaluated on a clone so the live game is never touched */
      const probe = S.game.clone();
      const mv = probe.tryPlay(top.p, color); if (mv) probe.play(top.p, mv);
      const a2 = probe.analyze(S.marks);
      const s2 = a2.score[S.scoring];
      f.territoryDelta = base ? (color === BLACK ? (s2.B - s2.W) - (base.B - base.W) : (s2.W - s2.B) - (base.W - base.B)) : 0;
      list.push({ p: top.p, n: top.n, wr: top.wr, f, previewOwner: a2.owner });
    }
    S.suggestions = list;
    renderSuggestions(); setStatus(); requestAnimationFrame(draw);
  }
  function maybeSuggest() { if (S.autoSuggest) runSuggestions(true); }
  function explainFor(item) {
    const f = item.f, color = S.youColor, enemy = color === BLACK ? WHITE : BLACK;
    const tags = [], lines = [];
    if (!f) { lines.push(t('expl.searchRank', item.wr, item.n)); return { tags, lines, live: true }; }
    if (f.captures) { tags.push(t('tags.capture')); lines.push(t('expl.capture' + (color === BLACK ? 'OneB' : 'One'), f.captures)); }
    if (f.savesAtari) { tags.push(t('tags.save')); lines.push(t('expl.saves', f.savesSize)); }
    if (f.atariOn.length) { tags.push(t('tags.atari')); lines.push(t('expl.atariOn', f.atariOn[0].size)); }
    if (f.connectsOwn >= 2) { tags.push(t('tags.connect')); lines.push(t('expl.connect')); }
    if (f.cutsEnemy >= 2) { tags.push(t('tags.cut')); lines.push(t('expl.cut')); }
    if (f.makesEye && !f.falseEye) { tags.push(t('tags.eye')); lines.push(t('expl.eye')); }
    else if (f.makesEye && f.falseEye) { tags.push(t('tags.eye')); lines.push(t('expl.falseEye')); }
    if (f.starPoint) { tags.push(t('tags.hoshi')); lines.push(t('expl.corner')); }
    else if (f.tengen) { tags.push(t('tags.bigPoint')); lines.push(t('expl.center')); }
    else if (f.edgeDist >= 2 && f.edgeDist <= 4) { tags.push(t('tags.extend')); lines.push(t('expl.extend')); }
    if (Math.abs(f.territoryDelta) >= 1.5) lines.push(t('expl.territoryGain', f.territoryDelta));
    if (S.game.koPoint === f.p) { tags.push(t('tags.ko')); lines.push(t('expl.koTake')); }
    const last = S.game.lastMove;
    if (last >= 0) { const lr = Math.floor(last / S.size), lc = last % S.size;
      if (Math.max(Math.abs(lr - f.row), Math.abs(lc - f.col)) <= 2) lines.push(t('expl.nearLast')); }
    if (!lines.length) lines.push(t('expl.nothing'));
    lines.push(t('expl.searchRank', item.wr, item.n));
    return { tags: tags.slice(0, 3), lines };
  }
  const sugRows = new Map();   /* point -> persistent row element (no rebuild, no flicker) */
  function renderSuggestions() {
    const box = $('#sug-list'); if (!box) return;
    const items = S.suggestions;
    const cnt = $('#sug-count');
    if (cnt) cnt.innerHTML = S.analyzing
      ? `<span class="thinking-dot"></span> ${t('analyzing')}… <span class="mono">${items.reduce((a, x) => a + x.n, 0)}</span>`
      : (items.length ? `<span class="mono">${items.reduce((a, x) => a + x.n, 0)}</span> ${t('visits')}` : '');

    /* FLIP step 1 — where are the rows we already showed? */
    const first = new Map();
    for (const [p, el] of sugRows) if (el.isConnected) first.set(p, el.getBoundingClientRect());

    let ph = box.querySelector('.sug-empty');
    if (!items.length) {
      for (const [p, el] of sugRows) { if (el.isConnected) el.remove(); }
      sugRows.clear();
      if (!ph) { ph = document.createElement('div'); ph.className = 'muted sug-empty'; ph.style.cssText = 'font-size:12.5px;padding:6px 2px'; box.appendChild(ph); }
      ph.innerHTML = S.analyzing ? `<span class="thinking-dot"></span> ${t('analyzing')}…` : '';
      if (!S.analyzing) ph.remove();
      return;
    }
    if (ph) ph.remove();

    /* build / update rows, appended in ranked order */
    items.forEach((item, i) => {
      let el = sugRows.get(item.p), fresh = false;
      if (!el) {
        el = document.createElement('div'); el.dataset.p = item.p; sugRows.set(item.p, el); fresh = true;
        el.onclick = () => { S.pinned = S.pinned === item.p ? null : item.p; S.previewPoint = S.pinned;
          S.previewResult = (S.suggestions.find(x => x.p === item.p) || {}).previewOwner || null; renderSuggestions(); requestAnimationFrame(draw); };
      }
      paintRow(el, item, i, fresh);
      box.appendChild(el);
    });
    /* rows that dropped out of the top five slide out */
    for (const [p, el] of sugRows) {
      if (items.some(x => x.p === p)) continue;
      sugRows.delete(p);
      if (!el.isConnected) continue;
      el.classList.add('leaving'); setTimeout(() => { el.classList.add('gone'); setTimeout(() => el.remove(), 240); }, 10);
    }
    /* FLIP step 2 — invert and play (skipped when the user prefers reduced motion) */
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (const item of items) {
      const el = sugRows.get(item.p); const f = first.get(item.p); if (!el || !f) continue;
      const l = el.getBoundingClientRect(), dy = f.top - l.top;
      if (Math.abs(dy) < 1) continue;
      el.style.transition = 'none'; el.style.transform = `translateY(${dy}px)`;
      requestAnimationFrame(() => { el.style.transition = ''; el.style.transform = ''; });
    }
  }
  function paintRow(el, item, i, fresh) {
    /* structure is built once per row; refreshes only patch values in place so the
       win-rate bar can transition smoothly instead of re-rendering (no flicker) */
    if (!el.firstChild) {
      el.innerHTML = `<div class="sug-top"><span class="rank"></span><span class="coord"></span>
          <span class="tags"></span><span class="wr mono"></span></div>
        <div class="wrbar"><i></i></div><div class="expl"><ul></ul></div>`;
      el._rank = el.querySelector('.rank'); el._coord = el.querySelector('.coord');
      el._tags = el.querySelector('.tags'); el._wr = el.querySelector('.wr'); el._bar = el.querySelector('.wrbar i');
      el._list = el.querySelector('.expl ul');
    }
    const { tags, lines } = explainFor(item);
    const set = (el2, key, val) => { if (el2.dataset[key] !== val) { el2.dataset[key] = val; el2.textContent = val; } };
    set(el._rank, 'v', String(i + 1));
    set(el._coord, 'v', coordName(item.p));
    set(el._wr, 'v', (item.wr * 100).toFixed(0) + '%');
    const sx = (Math.max(2, Math.round(item.wr * 100)) / 100).toFixed(3);
    if (el._bar.style.transform !== 'scaleX(' + sx + ')') el._bar.style.transform = 'scaleX(' + sx + ')';
    const tagKey = tags.join('|'), lineKey = lines.join('|');
    if (el._tags.dataset.v !== tagKey) { el._tags.dataset.v = tagKey;
      el._tags.innerHTML = tags.map(g => `<span class="tag">${g}</span>`).join(''); }
    if (el._list.dataset.v !== lineKey) { el._list.dataset.v = lineKey;
      el._list.innerHTML = lines.map(l => `<li>${l}</li>`).join(''); }
    el.className = 'sug' + (S.pinned === item.p ? ' pinned' : '') + (fresh ? ' enter' : '');
  }

  /* =====================================================================

     ===================================================================== */
  function pointFromEvent(e) {
    const r = canvas.getBoundingClientRect();
    const x = (e.clientX - r.left) * (boardPx / r.width), y = (e.clientY - r.top) * (boardPx / r.height);
    const c = Math.round((x - pad) / cell), rr = Math.round((y - pad) / cell);
    if (c < 0 || rr < 0 || c >= S.size || rr >= S.size) return -1;
    const X = pad + c * cell, Y = pad + rr * cell;
    if (Math.hypot(X - x, Y - y) > cell * .52) return -1;
    return rr * S.size + c;
  }
  canvas.addEventListener('mousemove', e => { const p = pointFromEvent(e); if (p !== S.hover) { S.hover = p; requestAnimationFrame(draw); } });

  canvas.addEventListener('click', e => { const p = pointFromEvent(e); if (p >= 0) humanPlay(p); });

  $('#btn-new').onclick = () => newGame();
  $('#btn-resign').onclick = () => { if (!S.game.over) { S.game.resign(S.youColor); setStatus(); refreshScore(); } };
  $('#btn-end').onclick = () => { if (!S.game.over) S.game.over = { type: 'count', winner: null };
    S.pinned = null; S.previewPoint = null; setStatus(); refreshScore(); runSuggestions(true); toast(t('ended')); };
  $('#btn-autodetect').onclick = () => { S.marks = new Set(); S.game.deadMarks = S.marks; refreshScore(); renderSuggestions(); if (S.game.over) runSuggestions(true); };
  $('#btn-clearmarks').onclick = () => { S.marks = new Set(); S.game.deadMarks = S.marks; refreshScore(); };
  $('#seg-cn').onclick = () => setScoring('area');
  $('#seg-jp').onclick = () => setScoring('territory');
  function setYouButtons() {
    $('#you-black').classList.toggle('on', S.youColor === BLACK);
    $('#you-white').classList.toggle('on', S.youColor === WHITE);
    $('#sc-b-who').textContent = (S.youColor === BLACK ? t('you') + ' · ' : '') + t('black');
    $('#sc-w-who').textContent = (S.youColor === WHITE ? t('you') + ' · ' : '') + t('white');
  }
  function setScoring(sys) {
    S.scoring = sys;
    $('#seg-cn').classList.toggle('on', sys === 'area'); $('#seg-jp').classList.toggle('on', sys === 'territory');
    S.game.rules.komi = sys === 'area' ? S.komiCN : S.komiJP;
    refreshScore(); renderSuggestions();
  }
  $('#you-black').onclick = () => { S.youColor = BLACK; setYouButtons(); newGame(); };
  $('#you-white').onclick = () => { S.youColor = WHITE; setYouButtons(); newGame(); };
  $('#lang-toggle').onclick = () => { S.lang = S.lang === 'zh' ? 'en' : 'zh'; buildUI(); renderSuggestions(); renderLog(); setStatus(); refreshScore(); };
  $('#sw-overlay').querySelector('input').onchange = e => { S.overlay = e.target.checked; overlayTarget = S.overlay ? 1 : 0; requestAnimationFrame(draw); };
  $('#sw-sound').querySelector('input').onchange = e => S.sound = e.target.checked;
  $('#sw-auto').querySelector('input').onchange = e => { S.autoSuggest = e.target.checked; if (S.autoSuggest) runSuggestions(true); };
  $('#sw-suicide').querySelector('input').onchange = e => { S.suicide = e.target.checked; newGame(); };
  $('#sel-size').onchange = e => { S.size = +e.target.value; layout(); newGame(); };
  $('#sel-strength').onchange = e => S.strength = +e.target.value;
  window.addEventListener('resize', () => { layout(); requestAnimationFrame(draw); });

  /* =====================================================================
     BOOT
     ===================================================================== */
  window.__GO_APP__ = { S, newGame, runSuggestions, refreshScore, layout, draw, setScoring, buildUI };
  layout(); buildUI(); newGame();
  overlayTarget = 1;
  if (S.autoSuggest) setTimeout(() => runSuggestions(true), 300);
})();

</script>
</body>
</html>
