<!DOCTYPE html>
<html lang="en">
<head>

<title>Sudoku</title>
<style>

  .cell.bB::before { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--thick); }

  .palette .cell[data-d="1"] { color: var(--d1); } .palette .cell[data-d="2"] { color: var(--d2); }
  .palette .cell[data-d="3"] { color: var(--d3); } .palette .cell[data-d="4"] { color: var(--d4); }
  .palette .cell[data-d="5"] { color: var(--d5); } .palette .cell[data-d="6"] { color: var(--d6); }
  .palette .cell[data-d="7"] { color: var(--d7); } .palette .cell[data-d="8"] { color: var(--d8); }
  .palette .cell[data-d="9"] { color: var(--d9); }
  .palette .cell.given { font-weight: 800; }
  .palette .pad button[data-d="1"] { color: var(--d1); } .palette .pad button[data-d="2"] { color: var(--d2); }
  .palette .pad button[data-d="3"] { color: var(--d3); } .palette .pad button[data-d="4"] { color: var(--d4); }
  .palette .pad button[data-d="5"] { color: var(--d5); } .palette .pad button[data-d="6"] { color: var(--d6); }
  .palette .pad button[data-d="7"] { color: var(--d7); } .palette .pad button[data-d="8"] { color: var(--d8); }

  .palette .notes span[data-d="3"] { color: var(--d3); opacity: .85; } .palette .notes span[data-d="4"] { color: var(--d4); opacity: .85; }

    position: absolute; top: 2px; right: 4px; font-size: 9px; color: var(--muted); font-weight: 600;

  .tools { display: flex; gap: 6px; justify-content: space-between; }

    background: var(--panel); color: var(--text); box-shadow: var(--shadow); border-radius: 10px; padding: 9px 4px 7px;
    font: inherit; font-size: 11px; transition: transform .1s, background .12s;

  }

  .win h2 { margin: 0 0 6px; font-size: 22px; }
  .win p { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .win button { margin-top: 16px; border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 10px 22px; font: inherit; font-size: 14px; cursor: pointer; }
  .loading { opacity: .55; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

<body>
<div class="app">
  <header>
    <h1>Sudoku</h1>
    <nav class="chips" id="chips"></nav>
  </header>
  <div class="stats">
    <span>Time <b id="time">00:00</b></span>
    <span>Left <b id="left">0</b></span>
    <span class="tech" id="tech"></span>
  </div>
  <div class="board" id="board"></div>
  <div class="pad" id="pad"></div>
  <div class="tools" id="tools"></div>
</div>
<div class="win" id="win"><div class="card"><h2>Solved</h2><p id="wintxt"></p><button id="winnew">New puzzle</button></div></div>
<script>
'use strict';
/* ============================================================

  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;

  for (const u of UNITS) { const seen = new Set(); for (const i of u) { const v = g[i]; if (v) { if (seen.has(v)) return false; seen.add(v); } } }
  return true;
}
function clues(g) { let n = 0; for (let i = 0; i < 81; i++) if (g[i]) n++; return n; }

  const c = new Int32Array(81);
  for (let i = 0; i < 81; i++) {
    if (g[i]) { c[i] = 0; continue; }
    let m = FULL;

/* ---- counting solver (MRV backtracking) ---- */
function countSolutions(g, limit = 2, nodeBudget = 30000) {
  const c0 = candsFrom(g); if (!c0) return 0;
  const empties = []; for (let i = 0; i < 81; i++) if (!g[i]) empties.push(i);
  let nodes = 0, sols = 0;

    if (++nodes > nodeBudget) return false;
    let bi = -1, bc = 10;
    for (const i of empties) { const n = pop(c[i]); if (n && n < bc) { bc = n; bi = i; if (n === 1) break; } }

    let m = c[bi];

      const bit = m & -m; m -= bit;
      const nc = Int32Array.from(c); nc[bi] = 0; let ok = true;
      for (const p of PEERS[bi]) if (nc[p] & bit) { nc[p] &= ~bit; if (!nc[p]) { ok = false; break; } }
      if (ok && rec(nc)) return true;
      if (sols >= limit) return true;
    }
    return false;
  }
  rec(c0);
  return sols;
}

function solveOne(g) {
  const c0 = candsFrom(g); if (!c0) return null;
  const empties = []; for (let i = 0; i < 81; i++) if (!g[i]) empties.push(i);
  const vals = Int32Array.from(g);
  function rec(c) {
    let bi = -1, bc = 10;
    for (const i of empties) { const n = pop(c[i]); if (n && n < bc) { bc = n; bi = i; if (n === 1) break; } }
    if (bi < 0) return true;
    let m = c[bi];

      const bit = m & -m; m -= bit;

      for (const p of PEERS[bi]) {

        else if (nc[p] & bit) { nc[p] &= ~bit; if (!nc[p]) { ok = false; break; } }

      if (ok && rec(nc)) return true;
      vals[bi] = 0;
      if (!ok) break;

function fillRandom(g, rnd) {
  const i = g.indexOf(0); if (i < 0) return true;
  const c = candsFrom(g); if (!c) return false;

  for (let k = ds.length - 1; k > 0; k--) { const j = (rnd() * (k + 1)) | 0; const t = ds[k]; ds[k] = ds[j]; ds[j] = t; }

/* ---- symmetric dig to minimality ---- */

  const order = []; for (let i = 0; i < 81; i++) if (g[i]) order.push(i);

    if (countSolutions(trial, 2, 30000) === 1) { g[i] = 0; if (mirror && i !== m) g[m] = 0; }

/* ============================================================
   Logic rater. Each technique performs ONE step on the candidate
   grid c; st.assign records forced placements; st.maxLevel = hardest
   technique actually needed.
   ============================================================ */
const TECH = {
  NS: 1, HS: 2, NP: 3, NT: 4, NQ: 5, HP: 6, HT: 7, POINT: 8, BOXLINE: 9,
  XWING: 10, SWORD: 11, JELLY: 12, XYWING: 13, XYZWING: 14, WWING: 15, UR: 16, COLOR: 17, GUESS: 18

const TECH_NAME = {
  1: '唯一數', 2: '隱性唯一數', 3: '顯性數對', 4: '顯性三連', 5: '顯性四連', 6: '隱性數對', 7: '隱性三連',
  8: '宮行列排除', 9: '行列宮排除', 10: 'X翼', 11: '劍魚', 12: '水母', 13: 'XY翼', 14: 'XYZ翼',
  15: 'W翼', 16: '唯一矩形', 17: '著色連鎖', 18: '試誤推定'

const LADDER = [
  ['ns', TECH.NS], ['hs', TECH.HS], ['np', TECH.NP], ['nt', TECH.NT], ['nq', TECH.NQ],
  ['hp', TECH.HP], ['ht', TECH.HT], ['point', TECH.POINT], ['boxline', TECH.BOXLINE],
  ['xwing', TECH.XWING], ['sword', TECH.SWORD], ['jelly', TECH.JELLY],
  ['xywing', TECH.XYWING], ['xyzwing', TECH.XYZWING], ['wwing', TECH.WWING], ['ur', TECH.UR], ['color', TECH.COLOR]

function combos(arr, k) { const res = [], cur = []; (function go(s) { if (cur.length === k) { res.push(cur.slice()); return; } for (let i = s; i <= arr.length - (k - cur.length); i++) { cur.push(arr[i]); go(i + 1); cur.pop(); } })(0); return res; }

function place(c, st, i, d) {
  st.assign[i] = d; c[i] = 0;

}

function ns(c, st) {
  for (const i of emptyCells(c)) if (pop(c[i]) === 1) { place(c, st, i, BITDIGIT[c[i]]); return true; }

}

      const m = c[t[0]] | c[t[1]] | c[t[2]] | c[t[3]];
      if (pop(m) === 4) { let did = false; for (const i of u) if (t.indexOf(i) < 0 && c[i] & m) { c[i] &= ~m; did = true; } if (did) return true; }

  function doHint() {
    if (S.finished) return;
    let i = (S.sel >= 0 && !isGiven(S.sel) && S.user[S.sel] !== S.sol[S.sel]) ? S.sel : -1;
    if (i < 0) for (let k = 0; k < 81; k++) if (!isGiven(k) && S.user[k] !== S.sol[k]) { i = k; break; }
    if (i < 0) return;
    snapshot(); S.sel = i; S.user[i] = S.sol[i]; S.notes[i] = 0; S.hintCells[i] = 1; S.hints++;
    for (const p of C.PEERS[i]) if (S.notes[p] & C.BITS[S.sol[i]]) S.notes[p] &= ~C.BITS[S.sol[i]];
    done(); render(); save();
  }
  function doCheck() {
    if (!S.grid) return;
    let bad = 0;
    for (let i = 0; i < 81; i++) if (!isGiven(i) && S.user[i] && S.user[i] !== S.sol[i]) bad++;
    S.checkMsg = bad ? `Check: ${bad} wrong` : 'Check: nothing wrong so far';
    render();
  }
  function done() {
    for (let i = 0; i < 81; i++) if (!isGiven(i) && S.user[i] !== S.sol[i]) return;
    S.finished = true; S.running = false;
    wintxt.textContent = `${fmt(S.elapsed)} · ${S.hints ? `${S.hints} hint${S.hints > 1 ? 's' : ''}` : 'no hints'}`;
    win.classList.add('on'); save();
  }

  /* ---------------- render ---------------- */
  const fmt = ms => { const s = Math.floor(ms / 1000); return `${String((s / 60) | 0).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  const cache = new Array(81).fill(null);
  let lastTime = '', lastLeft = -1, lastTech = null;
  function render() {
    const t = fmt(S.elapsed); if (t !== lastTime) { lastTime = t; elTime.textContent = t; }
    const cnt = new Array(10).fill(0); let left = 0;
    for (let i = 0; i < 81; i++) { const v = S.grid[i] || S.user[i]; if (v) cnt[v]++; else left++; }
    if (left !== lastLeft) { lastLeft = left; elLeft.textContent = left; }
    const tech = S.checkMsg || (S.rating ? (S.rating.sub || `Hardest step: ${techEn(S.rating) || S.rating.name}`) : '');
    if (tech !== lastTech) { lastTech = tech; elTech.textContent = tech; }

    const selVal = S.sel >= 0 ? (S.grid[S.sel] || S.user[S.sel]) : 0;
    const peers = S.sel >= 0 ? C.PEERS[S.sel] : null;
    for (let i = 0; i < 81; i++) {
      const el = cells[i], r = (i / 9) | 0, c = i % 9;
      let cls = 'cell' + (c % 3 === 2 && c < 8 ? ' bR' : '') + (r % 3 === 2 && r < 8 ? ' bB' : '');
      const v = S.grid[i] || S.user[i];
      if (isGiven(i)) cls += ' given';
      else if (v && conflict(i)) cls += ' err';
      if (S.sel === i) cls += ' sel';
      else if (selVal && v === selVal) cls += ' same';
      else if (peers && peers.indexOf(i) >= 0) cls += ' peer';
      if (v && !isGiven(i) && S.hintCells[i]) cls += ' hintc';
      let html = v ? `<span>${v}</span>` : '';
      if (!v && S.notes[i]) {
        html = '<div class="notes">';
        for (let d = 1; d <= 9; d++) html += `<span${S.notes[i] & C.BITS[d] ? ` data-d="${d}"` : ''}>${S.notes[i] & C.BITS[d] ? d : ''}</span>`;
        html += '</div>';
      }
      el.dataset.d = v || '';
      const sig = cls + '|' + html;
      if (cache[i] !== sig) { cache[i] = sig; el.className = cls; el.innerHTML = html; if (html && v) flash(el); }
    }
    for (const b of pad.children) {
      if (!b.dataset || !b.dataset.d) continue;
      const rem = 9 - cnt[+b.dataset.d];
      const sig = String(rem);
      if (b.dataset.count !== sig) {
        b.dataset.count = sig; b.querySelector('small').textContent = sig;
        b.setAttribute('aria-label', `${b.dataset.d} — ${sig} left`);
      }
    }
    const ub = tools.querySelector('[data-act="doUndo"]'); if (ub) ub.disabled = !S.history.length || S.finished;
  }
  let flashQ = [];
  function flash(el) { el.classList.add('pop'); flashQ.push(el); if (flashQ.length > 3) { const old = flashQ.shift(); setTimeout(() => old.classList.remove('pop'), 180); } }
  setInterval(() => { if (S.running) { S.elapsed = performance.now() - S.startMs; render(); } }, 500);

  /* ---------------- persistence ---------------- */
  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        tier: S.tier, grid: C.toStr(S.grid), user: Array.from(S.user), notes: Array.from(S.notes),
        hintCells: Array.from(S.hintCells), hints: S.hints, elapsed: Math.round(S.elapsed),
        finished: S.finished, rating: S.rating ? { name: S.rating.name || null, sub: S.rating.sub || null } : null,
        palette: S.palette
      }));
    } catch (e) { }
  }
  function restore() {
    try {
      const raw = localStorage.getItem(STORE); if (!raw) return false;
      const d = JSON.parse(raw); if (!d.grid || d.grid.length !== 81) return false;
      const g = C.fromStr(d.grid); const sol = C.solveOne(g); if (!sol) return false;
      S.tier = d.tier || 'expert'; S.grid = g; S.sol = sol;
      S.user = Int32Array.from(d.user || new Array(81).fill(0));
      S.notes = Int32Array.from(d.notes || new Array(81).fill(0));
      S.hintCells = Uint8Array.from(d.hintCells || new Array(81).fill(0));
      S.hints = d.hints || 0; S.elapsed = d.elapsed || 0; S.finished = !!d.finished; S.rating = d.rating || null;
      S.palette = d.palette !== false;
      document.body.classList.toggle('palette', S.palette);
      const pb = document.getElementById('btnPalette'); if (pb) pb.setAttribute('aria-pressed', String(S.palette));
      for (const b of chips.children) if (b.dataset) b.setAttribute('aria-pressed', String(b.dataset.t === S.tier));
      S.startMs = performance.now() - S.elapsed; S.running = !S.finished;
      if (S.finished) { wintxt.textContent = `${fmt(S.elapsed)} · ${S.hints ? `${S.hints} hint${S.hints > 1 ? 's' : ''}` : 'no hints'}`; }
      return true;
    } catch (e) { return false; }
  }

  /* ---------------- PDF (pure JS writer) ---------------- */
  const pdfEsc = s => String(s).replace(/[^\x20-\x7e]/g, '').replace(/([\\()])/g, '\\$1');
  const PDFPAL = { 1: '#cf4436', 2: '#cf7d1e', 3: '#b8940f', 4: '#3f9d4e', 5: '#12a08f', 6: '#2f80d6', 7: '#6163cf', 8: '#9a52c4', 9: '#cf4f93' };
  const hexrgb = h => [1, 3, 5].map(i => (parseInt(h.slice(i, i + 2), 16) / 255).toFixed(2)).join(' ');
  function buildPdf(header, grid, user, notes, palette) {
    const PAGE = [595.276, 841.89], M = 56, CELL = 40, N = CELL * 9;
    const ox = (PAGE[0] - N) / 2, oy = PAGE[1] - M - 54 - N;
    const INK = '0.10 0.12 0.15', MID = '0.42 0.46 0.52', LIGHT = '0.72 0.75 0.79';
    let s = `BT /F1 15 Tf ${INK} rg 1 0 0 1 ${M} ${PAGE[1] - M + 4} Tm (${pdfEsc(header[0])}) Tj ET\n`;
    if (header[1]) s += `BT /F2 9.5 Tf ${MID} rg 1 0 0 1 ${M} ${PAGE[1] - M - 12} Tm (${pdfEsc(header[1])}) Tj ET\n`;
    // grid lines
    for (let i = 0; i <= 9; i++) {
      const w = i % 3 === 0 ? 1.6 : 0.6, col = i % 3 === 0 ? INK : LIGHT;
      const xp = (ox + i * CELL).toFixed(2), yp = (oy + i * CELL).toFixed(2);
      s += `q ${col} RG ${w} w ${xp} ${oy.toFixed(2)} m ${xp} ${(oy + N).toFixed(2)} l S Q\n`;
      s += `q ${col} RG ${w} w ${ox.toFixed(2)} ${yp} m ${(ox + N).toFixed(2)} ${yp} l S Q\n`;
    }
    const DIGW = 0.556; // Helvetica digit advance (per 1000 units)
    for (let i = 0; i < 81; i++) {
      const r = (i / 9) | 0, c = i % 9, x = ox + c * CELL, y = oy + (8 - r) * CELL;
      if (grid[i]) {
        const size = 15, d = String(grid[i]), col = palette ? hexrgb(PDFPAL[grid[i]]) : INK;
        s += `BT /F1 ${size} Tf ${col} rg 1 0 0 1 ${(x + CELL / 2 - DIGW * size / 2).toFixed(2)} ${(y + CELL / 2 - size * 0.36).toFixed(2)} Tm (${d}) Tj ET\n`;
      } else if (user[i]) {
        const size = 15, d = String(user[i]), col = palette ? hexrgb(PDFPAL[user[i]]) : MID;
        s += `BT /F2 ${size} Tf ${col} rg 1 0 0 1 ${(x + CELL / 2 - DIGW * size / 2).toFixed(2)} ${(y + CELL / 2 - size * 0.36).toFixed(2)} Tm (${d}) Tj ET\n`;
      } else if (notes[i]) {
        const size = 7.5, cw = CELL / 3;
        for (let d = 1; d <= 9; d++) if (notes[i] & C.BITS[d]) {
          const col = (d - 1) % 3, row = ((d - 1) / 3) | 0;
          const tx = x + col * cw + cw / 2 - DIGW * size / 2, ty = y + CELL - (row + 1) * cw - size * 0.18;
          s += `BT /F2 ${size} Tf ${palette ? hexrgb(PDFPAL[d]) : MID} rg 1 0 0 1 ${tx.toFixed(2)} ${ty.toFixed(2)} Tm (${d}) Tj ET\n`;
        }
      }
    }

    const objs = [
      '<< /Type /Catalog /Pages 2 0 R >>',
      '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
      `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PAGE[0]} ${PAGE[1]}] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>`,
      `<< /Length ${s.length} >>\nstream\n${s}endstream`,
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'
    ];
    let out = '%PDF-1.4\n', offsets = [];
    objs.forEach((o, i) => { offsets.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
    const xref = out.length;
    out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
    for (const o of offsets) out += String(o).padStart(10, '0') + ' 00000 n \n';
    out += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`;
    return out;
  }
  function exportPdf() {
    if (!S.grid) return;
    const tier = TIERS.find(t => t.id === S.tier);
    const name = S.rating && S.rating.name ? S.rating.name : tier.en.toUpperCase();
    const sub = `${tier.en.toUpperCase()} · ${C.clues(S.grid)} clues · ${fmt(S.elapsed)}${S.hints ? ' · ' + S.hints + ' hints' : ''}${S.rating && S.rating.sub && S.rating.name ? ' · ' + S.rating.sub : ''}`;
    const pdf = buildPdf([name, sub], S.grid, S.user, S.notes, S.palette);
    const blob = new Blob([pdf], { type: 'application/pdf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `sudoku-${tier.en}-${fmt(S.elapsed).replace(':', '')}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  window.__sudoku = { S, C, exportPdf, newPuzzle, TIERS, FAMOUS, input, select, doHint, doCheck, doUndo, doErase, render, done, setPalette, fmt };

  if (!restore()) newPuzzle(); else render();
})();

</script>
</body>
</html>
