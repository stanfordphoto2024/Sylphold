<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sudoku</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --line: #d9dee6; --thick: #33404f;
    --text: #1c2733; --muted: #7a8798; --given: #16202b; --user: #2b6cb0; --hintc: #0a8f6d;
    --sel: #cfe1f7; --peer: #eaf1fa; --same: #d8e7f8; --err: #d1453b; --accent: #2b6cb0;
    --chip: #eceff4; --chip-on: #2b6cb0; --chip-on-tx: #fff; --shadow: 0 1px 2px rgba(20,30,45,.06), 0 8px 24px rgba(20,30,45,.06);
    --errbg: rgba(214,69,59,.13);
    /* digit palette — light mode (evenly spaced hues, tuned for white panel contrast) */
    --d1: #cf4436; --d2: #cf7d1e; --d3: #b8940f; --d4: #3f9d4e; --d5: #12a08f;
    --d6: #2f80d6; --d7: #6163cf; --d8: #9a52c4; --d9: #cf4f93;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161d; --panel: #172029; --line: #2b3745; --thick: #93a2b5;
      --text: #e7edf4; --muted: #8593a5; --given: #f1f5f9; --user: #6fb1f5; --hintc: #4fd1a5;
      --sel: #2b4d70; --peer: #1d2836; --same: #24405d; --err: #f2777a; --accent: #4f9be6;
      --chip: #222e3c; --chip-on: #4f9be6; --chip-on-tx: #0b1118; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
      --errbg: rgba(242,119,122,.16);
      /* digit palette — dark mode (same hues, lifted for the dark panel) */
      --d1: #f2705f; --d2: #eda25f; --d3: #e8c95a; --d4: #6fce7f; --d5: #4ecdb8;
      --d6: #6cb0f5; --d7: #9aa0f5; --d8: #c888ea; --d9: #f283bf;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    display: flex; justify-content: center; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
  }
  .app { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 2px 4px; }
  h1 { font-size: 19px; margin: 0; letter-spacing: .5px; font-weight: 700; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 0; background: var(--chip); color: var(--text); font: inherit; font-size: 13px;
    padding: 6px 11px; border-radius: 999px; cursor: pointer; transition: background .16s, color .16s, transform .12s;
  }
  .chip:hover { transform: translateY(-1px); }
  .chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-tx); }
  .stats { display: flex; align-items: center; gap: 14px; padding: 0 4px; font-size: 13px; color: var(--muted); }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; font-weight: 600; }
  .stats .tech { margin-left: auto; }
  .board {
    background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; touch-action: manipulation;
    display: grid; grid-template-columns: repeat(9, 1fr); gap: 0; aspect-ratio: 1; user-select: none;
  }
  .cell {
    position: relative; display: grid; place-items: center; aspect-ratio: 1; cursor: pointer;
    border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    font-size: clamp(17px, 4.6vw, 26px); font-weight: 500; color: var(--user);
    font-variant-numeric: tabular-nums; transition: background .12s;
  }
  .cell:nth-child(9n) { border-right: 0; }
  .cell:nth-child(n+73) { border-bottom: 0; }
  .cell.bR::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 2px; background: var(--thick); }
  .cell.bB::before { content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: var(--thick); }
  .cell.given { color: var(--given); font-weight: 700; }
  body:not(.palette) .cell.hintc { color: var(--hintc); }
  .palette .cell.hintc > span { text-decoration: underline; text-decoration-color: var(--hintc); text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .cell.peer { background: var(--peer); }
  .cell.same { background: var(--same); }
  .cell.sel { background: var(--sel); }
  .cell.err { color: var(--err); }
  /* per-digit colours, enabled by the palette toggle */
  .palette .cell[data-d="1"] { color: var(--d1); } .palette .cell[data-d="2"] { color: var(--d2); }
  .palette .cell[data-d="3"] { color: var(--d3); } .palette .cell[data-d="4"] { color: var(--d4); }
  .palette .cell[data-d="5"] { color: var(--d5); } .palette .cell[data-d="6"] { color: var(--d6); }
  .palette .cell[data-d="7"] { color: var(--d7); } .palette .cell[data-d="8"] { color: var(--d8); }
  .palette .cell[data-d="9"] { color: var(--d9); }
  .palette .cell.given { font-weight: 800; }
  .palette .pad button[data-d="1"] { color: var(--d1); } .palette .pad button[data-d="2"] { color: var(--d2); }
  .palette .pad button[data-d="3"] { color: var(--d3); } .palette .pad button[data-d="4"] { color: var(--d4); }
  .palette .pad button[data-d="5"] { color: var(--d5); } .palette .pad button[data-d="6"] { color: var(--d6); }
  .palette .pad button[data-d="7"] { color: var(--d7); } .palette .pad button[data-d="8"] { color: var(--d8); }
  .palette .pad button[data-d="9"] { color: var(--d9); }
  .palette .cell.err { color: var(--err) !important; }
  .palette .notes span[data-d="1"] { color: var(--d1); opacity: .85; } .palette .notes span[data-d="2"] { color: var(--d2); opacity: .85; }
  .palette .notes span[data-d="3"] { color: var(--d3); opacity: .85; } .palette .notes span[data-d="4"] { color: var(--d4); opacity: .85; }
  .palette .notes span[data-d="5"] { color: var(--d5); opacity: .85; } .palette .notes span[data-d="6"] { color: var(--d6); opacity: .85; }
  .palette .notes span[data-d="7"] { color: var(--d7); opacity: .85; } .palette .notes span[data-d="8"] { color: var(--d8); opacity: .85; }
  .palette .notes span[data-d="9"] { color: var(--d9); opacity: .85; }
  .cell.pop span { animation: pop .16s ease-out; display: block; }
  @keyframes pop { from { transform: scale(.72); opacity: .3; } to { transform: scale(1); opacity: 1; } }
  .notes { display: grid; grid-template-columns: repeat(3, 1fr); width: 92%; height: 92%; font-size: clamp(7px, 1.7vw, 10px); color: var(--muted); line-height: 1; }
  .notes span { display: grid; place-items: center; }
  .reason {
    background: var(--panel); border-radius: 10px; box-shadow: var(--shadow); padding: 10px 12px 12px;
    font-size: 12.5px; line-height: 1.6; color: var(--text); animation: rise .2s ease-out;
    max-height: 36vh; overflow-y: auto; overscroll-behavior: contain;
  }
  .reason[hidden] { display: none; }
  .reason ol { margin: 0; padding-left: 2px; list-style: none; }
  .reason li { margin: 3px 0; }
  .reason li.final { font-weight: 600; }
  .reason ul.branches { list-style: none; margin: 6px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); }
  .reason ul.branches > li { color: var(--muted); }
  .reason ul.branches > li.ok { color: var(--text); }
  .reason ul.branches ul { list-style: none; margin: 2px 0 0; padding-left: 14px; }
  .reason ul.branches ul li::before { content: "\2192"; position: absolute; margin-left: -13px; color: var(--muted); }
  .reason li + li { margin-top: 6px; }
  .reason li code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; font-variant-numeric: tabular-nums; letter-spacing: 0; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .cell img.pk, .pad button img.pk { width: 78%; height: 78%; object-fit: contain; pointer-events: none; }
  .pad button img.pk { width: 26px; height: 26px; }
  .cell > span { position: relative; display: grid; place-items: center; }
  body.iconimg .cell.hintc > span::after { content: ""; position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); width: 46%; height: 2px; border-radius: 1px; background: var(--hintc); }
  .toolwrap { position: relative; display: inline-flex; }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: none; z-index: 30; min-width: 176px; box-shadow: var(--shadow); }
  .menu.open { display: block; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 8px; padding: 7px 10px; border: 0; background: none; border-radius: 8px; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; text-align: left; }
  .menu button:hover { background: var(--chip); }
  .menu button[aria-checked="true"]::after { content: '\2713'; margin-left: auto; color: var(--accent); }
  .pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; }
  .pad button {
    position: relative; border: 0; border-radius: 9px; background: var(--panel); color: var(--accent);
    box-shadow: var(--shadow); font: inherit; font-size: 19px; font-weight: 600; padding: 10px 0 8px; cursor: pointer;
    transition: transform .1s, background .12s, opacity .12s; font-variant-numeric: tabular-nums;
  }
  .pad button:hover { transform: translateY(-1px); }
  .pad button:active { transform: translateY(0) scale(.97); }
  .pad button[data-count="0"] { opacity: .38; }
  .pad button small {
    position: absolute; top: 2px; right: 4px; font-size: 9px; color: var(--muted); font-weight: 600;
    opacity: 0; transition: opacity .12s ease-out; pointer-events: none; font-variant-numeric: tabular-nums;
  }
  .pad button:hover small, .pad button:active small, .pad button.show small { opacity: 1; }
  .pad button span { display: block; padding-top: 2px; }
  .tools { display: flex; gap: 6px; justify-content: space-between; }
  .tools button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; cursor: pointer;
    background: var(--panel); color: var(--text); box-shadow: var(--shadow); border-radius: 10px; padding: 9px 4px 7px;
    font: inherit; font-size: 11px; transition: transform .1s, background .12s;
  }
  .tools button i { font-style: normal;
  }
  .tools button:hover { transform: translateY(-1px); }
  .tools button:active { transform: scale(.98); }
  .tools button[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-tx); }
  .tools button[aria-pressed="true"] svg { stroke: var(--chip-on-tx); }
  .tools svg { width: 19px; height: 19px; stroke: var(--text); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tools .sep { width: 1px; background: var(--line); flex: 0 0 1px; margin: 4px 2px; border-radius: 1px; }
  .tools button:disabled { opacity: .4; cursor: default; transform: none; }
  .win {
    position: fixed; inset: 0; display: grid; place-items: center; background: rgba(10,16,24,.45);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .win.on { opacity: 1; pointer-events: auto; }
  .win .card {
    background: var(--panel); color: var(--text); border-radius: 16px; padding: 26px 34px; text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,.35); transform: translateY(8px) scale(.98); transition: transform .24s cubic-bezier(.2,.9,.3,1.2);
  }
  .win.on .card { transform: none; }
  .win h2 { margin: 0 0 6px; font-size: 22px; }
  .win p { margin: 0; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .win button { margin-top: 16px; border: 0; background: var(--accent); color: #fff; border-radius: 10px; padding: 10px 22px; font: inherit; font-size: 14px; cursor: pointer; }
  .loading { opacity: .55; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Sudoku</h1>
    <nav class="chips" id="chips"></nav>
  </header>
  <div class="stats">
    <span>Time <b id="time">00:00</b></span>
    <span>Left <b id="left">0</b></span>
    <span class="tech" id="tech"></span>
  </div>
  <div class="board" id="board"></div>
  <div class="pad" id="pad"></div>
  <div class="tools" id="tools"></div>
  <div class="reason" id="reason" hidden><ol id="reasonlist"></ol></div>
</div>
<div class="win" id="win"><div class="card"><h2>Solved</h2><p id="wintxt"></p><button id="winnew">New puzzle</button></div></div>
<script>
'use strict';
/* ============================================================
   Sudoku core: generator (random full grid + symmetric dig with
   uniqueness check) and a logic-technique difficulty rater.
   Grid = Int32Array(81), 0 = empty. Candidate masks: bit d = 1<<d.
   ============================================================ */

const FULL = 0b1111111110;
const UNITS = [];
for (let r = 0; r < 9; r++) { const u = []; for (let c = 0; c < 9; c++) u.push(r * 9 + c); UNITS.push(u); }
for (let c = 0; c < 9; c++) { const u = []; for (let r = 0; r < 9; r++) u.push(r * 9 + c); UNITS.push(u); }
for (let br = 0; br < 3; br++) for (let bc = 0; bc < 3; bc++) {
  const u = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) u.push((br * 3 + r) * 9 + bc * 3 + c); UNITS.push(u);
}
const ROW_UNITS = UNITS.slice(0, 9), COL_UNITS = UNITS.slice(9, 18), BOX_UNITS = UNITS.slice(18);
const PEER_UNITS = [];
for (let i = 0; i < 81; i++) PEER_UNITS.push(UNITS.filter(u => u.indexOf(i) >= 0));
const PEERS = [];
for (let i = 0; i < 81; i++) {
  const s = new Set();
  for (const u of PEER_UNITS[i]) for (const j of u) if (j !== i && s.add(j)) { }
  PEERS.push(Int32Array.from(s));
}
const POP = new Uint8Array(1 << 10);
for (let m = 0; m < (1 << 10); m++) POP[m] = POP[m >> 1] + (m & 1);
const pop = m => POP[m];
const BITS = [0]; for (let d = 1; d <= 9; d++) BITS[d] = 1 << d;
const BITDIGIT = {}; for (let d = 1; d <= 9; d++) BITDIGIT[BITS[d]] = d;
const boxOf = i => Math.floor(i / 27) * 3 + Math.floor((i % 9) / 3);

const R = i => 'r' + (Math.floor(i / 9) + 1);
const CO = i => 'c' + (i % 9 + 1);
const coord = i => R(i) + CO(i);
const coordList = a => a.map(coord).join(', ');
function unitName(u) {
  const k = typeof u === 'number' ? u : UNITS.indexOf(u);
  if (k < 9) return 'row ' + (k + 1);
  if (k < 18) return 'column ' + (k - 8);
  return 'box ' + (k - 17);
}
const unitIndexOf = u => UNITS.indexOf(u);
const digitsOf = m => { const a = []; for (let d = 1; d <= 9; d++) if (m & BITS[d]) a.push(d); return a; };
var vnFor = null;
const vname = v => (vnFor ? vnFor(v) : v);
const digitsStr = m => digitsOf(m).map(vname).join(',');
function log(st, tech, why) { if (st && st.explain && st.log) { st.log.push({ tech, why }); st.n = st.log.length; } }
const candStr = (c, i) => '{' + digitsOf(c[i]).map(vname).join(',') + '}';   // candidates of a cell right now
/* why can digit d not sit in cell i?  answered from the position actually used for the step */
function whyNot(st, c, i, d) {
  const eff = st && st.eff;
  if (eff && eff[i]) return `${coord(i)} is already ${vname(eff[i])}`;
  if (c[i] && (c[i] & BITS[d])) return null;                       // it actually could take it
  for (const p of PEERS[i]) if (eff && eff[p] === d) return `${coord(i)} is covered by the ${vname(d)} at ${coord(p)}`;
  if (c[i] && !c[i]) return null;
  const seen = st.src ? st.src[i * 9 + d - 1] : 0;
  if (seen > 0) return `${coord(i)} lost ${vname(d)} in step ${seen}`;
  return `${coord(i)} cannot take ${vname(d)}`;
}
/* record which numbered step removed a candidate, so a later step can cite it */
function eraseMask(c, st, i, mask) {
  if (st && st.explain && st.src && st.log) for (const d of digitsOf(mask & c[i])) st.src[i * 9 + d - 1] = st.log.length;
  c[i] &= ~mask;
}
/* propagate singles only, to name the contradiction point of a failed assumption */
function deadEnd(g) {
  const c = candsFrom(g); if (!c) return 'a cell has no candidates left';
  let moved = true;
  while (moved) {
    moved = false;
    for (let i = 0; i < 81; i++) {
      if (!c[i] || pop(c[i]) !== 1) continue;
      const bit = c[i]; c[i] = 0;
      for (const p of PEERS[i]) if (c[p] & bit) { c[p] &= ~bit; if (!c[p]) return `${coord(p)} has no candidate left`; }
      moved = true;
    }
  }
  return null;
}

function mark(st, hits, tech) { /* record which step removed a candidate so later steps can cite it */
  if (!st || !st.src || !st.explain) return;
  st.pending = { tech, cells: hits };
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function valid(g) {
  for (const u of UNITS) { const seen = new Set(); for (const i of u) { const v = g[i]; if (v) { if (seen.has(v)) return false; seen.add(v); } } }
  return true;
}
function clues(g) { let n = 0; for (let i = 0; i < 81; i++) if (g[i]) n++; return n; }
function toStr(g) { let s = ''; for (let i = 0; i < 81; i++) s += g[i] || '.'; return s; }
function fromStr(s) { const g = new Int32Array(81); for (let i = 0; i < 81; i++) { const ch = s[i]; g[i] = (ch === '.' || ch === '0') ? 0 : +ch; } return g; }

function candsFrom(g) {
  const c = new Int32Array(81);
  for (let i = 0; i < 81; i++) {
    if (g[i]) { c[i] = 0; continue; }
    let m = FULL;
    for (const p of PEERS[i]) { const v = g[p]; if (v) m &= ~BITS[v]; }
    if (!m) return null;
    c[i] = m;
  }
  return c;
}

/* ---- counting solver (MRV backtracking) ---- */
function countSolutions(g, limit = 2, nodeBudget = 30000, trace) {
  const c0 = candsFrom(g); if (!c0) return 0;
  const empties = []; for (let i = 0; i < 81; i++) if (!g[i]) empties.push(i);
  let nodes = 0, sols = 0;
  function rec(c) {
    if (++nodes > nodeBudget) return false;
    let bi = -1, bc = 10;
    for (const i of empties) { const n = pop(c[i]); if (n && n < bc) { bc = n; bi = i; if (n === 1) break; } }
    if (bi < 0) { sols++; return sols >= limit; }
    let m = c[bi];
    while (m) {
      const bit = m & -m; m -= bit;
      const nc = Int32Array.from(c); nc[bi] = 0; let ok = true;
      for (const p of PEERS[bi]) if (nc[p] & bit) { nc[p] &= ~bit; if (!nc[p]) { if (trace && !trace.cell) trace.cell = p, trace.by = [bi, BITDIGIT[bit]]; ok = false; break; } }
      if (ok && rec(nc)) return true;
      if (sols >= limit) return true;
    }
    return false;
  }
  rec(c0);
  return sols;
}

function solveOne(g) {
  const c0 = candsFrom(g); if (!c0) return null;
  const empties = []; for (let i = 0; i < 81; i++) if (!g[i]) empties.push(i);
  const vals = Int32Array.from(g);
  function rec(c) {
    let bi = -1, bc = 10;
    for (const i of empties) { const n = pop(c[i]); if (n && n < bc) { bc = n; bi = i; if (n === 1) break; } }
    if (bi < 0) return true;
    let m = c[bi];
    while (m) {
      const bit = m & -m; m -= bit;
      const nc = Int32Array.from(c); nc[bi] = 0; vals[bi] = BITDIGIT[bit]; let ok = true;
      for (const p of PEERS[bi]) {
        if (vals[p]) { if (vals[p] === vals[bi]) { ok = false; break; } }
        else if (nc[p] & bit) { nc[p] &= ~bit; if (!nc[p]) { ok = false; break; } }
      }
      if (ok && rec(nc)) return true;
      vals[bi] = 0;
      if (!ok) break;
    }
    return false;
  }
  return rec(c0) ? vals : null;
}

function fillRandom(g, rnd) {
  const i = g.indexOf(0); if (i < 0) return true;
  const c = candsFrom(g); if (!c) return false;
  const ds = []; for (let d = 1; d <= 9; d++) if (c[i] & BITS[d]) ds.push(d);
  for (let k = ds.length - 1; k > 0; k--) { const j = (rnd() * (k + 1)) | 0; const t = ds[k]; ds[k] = ds[j]; ds[j] = t; }
  for (const d of ds) { g[i] = d; if (fillRandom(g, rnd)) return true; g[i] = 0; }
  return false;
}
function fullGrid(rnd) { const g = new Int32Array(81); fillRandom(g, rnd); return g; }

/* ---- symmetric dig to minimality ---- */
function digSym(g, rnd, mirror = true) {
  const order = []; for (let i = 0; i < 81; i++) if (g[i]) order.push(i);
  for (let k = order.length - 1; k > 0; k--) { const j = (rnd() * (k + 1)) | 0; const t = order[k]; order[k] = order[j]; order[j] = t; }
  for (const i of order) {

    if (viable.length === 1) {
      st.log.push({
        tech: 'trial', final: true,
        why: `No pattern applies at this point, so every candidate of ${coord(i)} ${candStr(c, i)} is followed through to the end. Only ${vname(viable[0])} survives, so ${coord(i)} = ${vname(viable[0])}.`

/* run one assumption out as far as the ladder can push it, so a trial says *where* it breaks */
function contradiction(c, st, base) {
  for (let i = 0; i < 81; i++) if (base[i] && !c[i] && !st.eff[i]) return `${coord(i)} is left with no candidate at all`;
  for (const u of UNITS) for (let d = 1; d <= 9; d++) {
    if (u.some(i => st.eff[i] === d)) continue;
    if (!u.some(i => !st.eff[i] && (c[i] & BITS[d]))) return `no cell of ${unitName(u)} can take ${d} any more`;
  }

}
function traceBranch(g, base, i, d, cap = 12) {
  const c = Int32Array.from(base);
  const st = { assign: {}, explain: true, log: [], eff: Int32Array.from(g), src: new Int16Array(810) };
  st.log.push({ tech: 'assume', why: `${coord(i)} = ${vname(d)}` });
  st.eff[i] = d; c[i] = 0;
  for (const p of PEERS[i]) c[p] &= ~BITS[d];
  for (let guard = 0; guard < cap; guard++) {
    const bad = contradiction(c, st, base);
    if (bad) return { steps: st.log, verdict: bad, ok: false };
    let acted = false;
    for (const [fn] of LADDER) { const before = Int32Array.from(c); if (TMAP[fn](c, st) && !sameArr(c, before)) { acted = true; break; } }
    if (!acted) { const bad2 = contradiction(c, st, base); return { steps: st.log, verdict: bad2 || 'the ladder gets no further', ok: !!bad2 }; }
  }
  const bad = contradiction(c, st, base);
  return { steps: st.log, verdict: bad || 'the ladder gets no further', ok: !!bad };
}

/* ---- generator: tier = {minLevel,maxLevel,trial,minClues,maxClues} ---- */
function makePuzzle(tier, rnd, budgetMs = 4000) {
  const t0 = Date.now(); let tries = 0;
  for (;;) {
    tries++;
    const g = digSym(fullGrid(rnd), rnd, true);
    const cl = clues(g);
    if (cl >= (tier.minClues || 0) && cl <= (tier.maxClues || 99)) {
      const r = rate(g);
      if (r && (tier.trial ? r.trial : (!r.trial && r.level >= tier.minLevel && r.level <= tier.maxLevel))) {
        return { grid: g, rating: r, tries, ms: Date.now() - t0 };
      }
    }
    if (Date.now() - t0 > budgetMs) return { grid: null, tries, ms: Date.now() - t0 };
  }
}

      const f = FAMOUS[(Math.random() * FAMOUS.length) | 0];
      S.grid = C.fromStr(f.g);
      S.rating = { name: f.name, by: f.by, se: f.se, level: 18, sub: `${f.name} · ${f.by} · ${f.se}` };
    } else {
      const res = C.makePuzzle(tier, C.mulberry32((Math.random() * 2147483647) | 0), 8000);
      if (!res.grid) { elTech.textContent = 'Generation failed'; S.busy = false; return; }
      S.grid = res.grid; S.rating = res.rating;
    }
    S.sol = C.solveOne(S.grid);
    S.user = new Int32Array(81); S.notes = new Int32Array(81); S.hintCells = new Uint8Array(81);
    S.history = []; S.hints = 0; S.sel = -1; S.finished = false; S.checkMsg = ''; S.reason = [];
    S.startMs = performance.now(); S.elapsed = 0; S.running = true;
    win.classList.remove('on'); document.body.classList.remove('loading'); S.busy = false; S.gen++;
    render(); save();
  }
  const frame = () => new Promise(r => requestAnimationFrame(r));

  function select(i) { if (S.sel === i) return; S.sel = i; render(); }
  function snapshot() { S.history.push({ u: Int32Array.from(S.user), n: Int32Array.from(S.notes), h: S.hints, hc: Uint8Array.from(S.hintCells) }); if (S.history.length > 300) S.history.shift(); }
  const isGiven = i => S.grid[i] !== 0;
  const conflict = i => {
    const v = S.user[i]; if (!v || isGiven(i)) return false;
    for (const p of C.PEERS[i]) if (S.grid[p] === v || S.user[p] === v) return true;
    return false;
  };
  function input(d) {
    if (S.finished || S.sel < 0) return;
    const i = S.sel; if (isGiven(i)) return;
    snapshot();
    if (S.notesMode && !S.user[i]) {
      S.notes[i] ^= C.BITS[d];
    } else {
      S.notes[i] = 0; S.user[i] = d; S.hintCells[i] = 0;
      for (const p of C.PEERS[i]) if (S.notes[p] & C.BITS[d]) S.notes[p] &= ~C.BITS[d]; // auto-erase notes in peers
    }
    S.checkMsg = '';
    done(); render(); save();
  }
  function doErase() {
    if (S.finished || S.sel < 0) return; const i = S.sel; if (isGiven(i)) return;
    if (!S.user[i] && !S.notes[i]) return;
    snapshot(); S.user[i] = 0; S.notes[i] = 0; S.hintCells[i] = 0; render(); save();
  }
  function doUndo() {
    if (!S.history.length || S.finished) return;
    const h = S.history.pop(); S.user = h.u; S.notes = h.n; S.hints = h.h; S.hintCells = h.hc;
    S.checkMsg = ''; render(); save();
  }
  function boardNow() {
    const b = Int32Array.from(S.grid);
    for (let i = 0; i < 81; i++) if (!b[i] && S.user[i]) b[i] = S.user[i];
    return b;
  }
  function doHint() {
    if (S.finished || !S.grid) return;
    const step = C.nextStep(boardNow());
    if (!step || step.cell < 0) {
      S.reason = step && step.steps && step.steps.length ? step.steps :
        [{ tech: 'stuck', why: 'Nothing follows from the current entries — check for a mistake before going on.' }];
      S.checkMsg = 'Hint: no cell can be deduced yet';
      render(); save(); return;
    }
    snapshot();
    S.sel = step.cell; S.user[step.cell] = step.digit; S.notes[step.cell] = 0; S.hintCells[step.cell] = 1; S.hints++;
    for (const p of C.PEERS[step.cell]) if (S.notes[p] & C.BITS[step.digit]) S.notes[p] &= ~C.BITS[step.digit];
    S.reason = step.steps || []; S.reasonCell = step.cell;
    S.checkMsg = '';
    done(); render(); save();
  }
  function doCheck() {
    if (!S.grid) return;
    let bad = 0;
    for (let i = 0; i < 81; i++) if (!isGiven(i) && S.user[i] && S.user[i] !== S.sol[i]) bad++;
    S.checkMsg = bad ? `Check: ${bad} wrong` : 'Check: nothing wrong so far';
    render();
  }
  function done() {
    for (let i = 0; i < 81; i++) if (!isGiven(i) && S.user[i] !== S.sol[i]) return;
    S.finished = true; S.running = false;
    wintxt.textContent = `${fmt(S.elapsed)} · ${S.hints ? `${S.hints} hint${S.hints > 1 ? 's' : ''}` : 'no hints'}`;
    win.classList.add('on'); save();
  }

  /* ---------------- render ---------------- */
  const fmt = ms => { const s = Math.floor(ms / 1000); return `${String((s / 60) | 0).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; };
  const cache = new Array(81).fill(null);
  let lastTime = '', lastLeft = -1, lastTech = null;
  function render() {
    const t = fmt(S.elapsed); if (t !== lastTime) { lastTime = t; elTime.textContent = t; }
    const cnt = new Array(10).fill(0); let left = 0;
    for (let i = 0; i < 81; i++) { const v = S.grid[i] || S.user[i]; if (v) cnt[v]++; else left++; }
    if (left !== lastLeft) { lastLeft = left; elLeft.textContent = left; }
    const tech = S.checkMsg || (S.rating ? (S.rating.sub || `Hardest step: ${techEn(S.rating) || S.rating.name}`) : '');
    if (tech !== lastTech) { lastTech = tech; elTech.textContent = tech; }

    const cs = SETS[S.icons];
    const selVal = S.sel >= 0 ? (S.grid[S.sel] || S.user[S.sel]) : 0;
    const peers = S.sel >= 0 ? C.PEERS[S.sel] : null;
    for (let i = 0; i < 81; i++) {
      const el = cells[i], r = (i / 9) | 0, c = i % 9;
      let cls = 'cell' + (c % 3 === 2 && c < 8 ? ' bR' : '') + (r % 3 === 2 && r < 8 ? ' bB' : '');
      const v = S.grid[i] || S.user[i];
      if (isGiven(i)) cls += ' given';
      else if (v && conflict(i)) cls += ' err';
      if (S.sel === i) cls += ' sel';
      else if (selVal && v === selVal) cls += ' same';
      else if (peers && peers.indexOf(i) >= 0) cls += ' peer';
      if (v && !isGiven(i) && S.hintCells[i]) cls += ' hintc';
      let html = v ? (cs ? `<span><img class="pk" src="data:${cs.mime || 'image/png'};base64,${cs.png[v]}" alt="${cs.names[v]}"></span>` : `<span>${v}</span>`) : '';
      if (!v && S.notes[i]) {
        html = '<div class="notes">';
        for (let d = 1; d <= 9; d++) html += `<span${S.notes[i] & C.BITS[d] ? ` data-d="${d}"` : ''}>${S.notes[i] & C.BITS[d] ? d : ''}</span>`;
        html += '</div>';
      }
      el.dataset.d = v || '';
      const sig = cls + '|' + html;
      if (cache[i] !== sig) { cache[i] = sig; el.className = cls; el.innerHTML = html; if (html && v) flash(el); }
    }
    for (const b of pad.children) {
      if (!b.dataset || !b.dataset.d) continue;
      const rem = 9 - cnt[+b.dataset.d];
      const sig = String(rem);
      if (b.dataset.count !== sig) {
        b.dataset.count = sig; b.querySelector('small').textContent = sig;
        b.setAttribute('aria-label', `${b.dataset.d} — ${sig} left`);
      }
    }
    if (padMode[0] !== S.icons) buildPad();
    for (const b of pad.querySelectorAll('button[data-d]')) {
      const rem2 = 9 - cnt[+b.dataset.d];
      const sm = b.querySelector('small'); if (sm && sm.textContent !== String(rem2)) sm.textContent = String(rem2);
    }
    const ub = tools.querySelector('[data-act="doUndo"]'); if (ub) ub.disabled = !S.history.length || S.finished;
    renderReason();
  }
  const escHtml = t => String(t).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const mdCoord = t => escHtml(t)
    .replace(/\br(\d)c(\d)/g, '<code>r$1c$2</code>')
    .replace(/\{([\d,]+)\}/g, '<code>{$1}</code>');
  function renderReason() {
    if (!S.reason || !S.reason.length) { reasonEl.hidden = true; reasonList.innerHTML = ''; return; }
    S.reasonCell = S.reasonCell === undefined ? (S.reasonCell = -1) : S.reasonCell;
    reasonEl.hidden = false;
    reasonList.innerHTML = S.reason.map(st => {
      const head = `<li${st.final ? ' class="final"' : ''}><b>${escHtml(st.tech).replace(/^\w/, m => m.toUpperCase())}</b> — ${mdCoord(st.why)}</li>`;
      if (!st.branches) return head;
      return head + '<ul class="branches">' + st.branches.map(b =>
        `<li class="${b.ok ? 'ok' : 'no'}"><b>${mdCoord('r' + (Math.floor(S.reasonCell / 9) + 1) + 'c' + (S.reasonCell % 9 + 1))} = ${b.assume}</b> → ${mdCoord(b.verdict)}` +
        (b.steps && b.steps.length > 1 ? `<ul>${b.steps.slice(1).map(t => `<li>${mdCoord(t.why)}</li>`).join('')}</ul>` : '') + '</li>').join('') + '</ul>';
    }).join('');
  }
  let flashQ = [];
  function flash(el) { el.classList.add('pop'); flashQ.push(el); if (flashQ.length > 3) { const old = flashQ.shift(); setTimeout(() => old.classList.remove('pop'), 180); } }
  setInterval(() => { if (S.running) { S.elapsed = performance.now() - S.startMs; render(); } }, 500);

  /* ---------------- persistence ---------------- */
  function save() {
    try {
      localStorage.setItem(STORE, JSON.stringify({
        tier: S.tier, grid: C.toStr(S.grid), user: Array.from(S.user), notes: Array.from(S.notes),
        hintCells: Array.from(S.hintCells), hints: S.hints, elapsed: Math.round(S.elapsed),
        finished: S.finished, rating: S.rating ? { name: S.rating.name || null, sub: S.rating.sub || null } : null,
        palette: S.palette, pkmn: S.pkmn, icons: S.icons, reason: S.reason
      }));
    } catch (e) { }
  }
  function restore() {
    try {
      const raw = localStorage.getItem(STORE); if (!raw) return false;
      const d = JSON.parse(raw); if (!d.grid || d.grid.length !== 81) return false;
      const g = C.fromStr(d.grid); const sol = C.solveOne(g); if (!sol) return false;
      S.tier = d.tier || 'expert'; S.grid = g; S.sol = sol;
      S.user = Int32Array.from(d.user || new Array(81).fill(0));
      S.notes = Int32Array.from(d.notes || new Array(81).fill(0));
      S.hintCells = Uint8Array.from(d.hintCells || new Array(81).fill(0));
      S.hints = d.hints || 0; S.elapsed = d.elapsed || 0; S.finished = !!d.finished; S.rating = d.rating || null;
      S.icons = d.icons || (d.pkmn === true ? 'pokemon' : d.palette === false ? 'none' : 'colour');
      S.palette = S.icons === 'colour'; S.pkmn = S.icons === 'pokemon'; S.reason = Array.isArray(d.reason) ? d.reason : [];
      document.body.classList.toggle('palette', S.palette);
      const pb = document.getElementById('btnPalette'); if (pb) pb.setAttribute('aria-pressed', String(S.palette));
      for (const b of chips.children) if (b.dataset) b.setAttribute('aria-pressed', String(b.dataset.t === S.tier));
      S.startMs = performance.now() - S.elapsed; S.running = !S.finished;
      if (S.finished) { wintxt.textContent = `${fmt(S.elapsed)} · ${S.hints ? `${S.hints} hint${S.hints > 1 ? 's' : ''}` : 'no hints'}`; }
      return true;
    } catch (e) { return false; }
  }

  /* ---------------- PDF (pure JS writer) ---------------- */
  const pdfEsc = s => String(s).replace(/[^\x20-\x7e]/g, '').replace(/([\\()])/g, '\\$1');
  const PDFPAL = { 1: '#cf4436', 2: '#cf7d1e', 3: '#b8940f', 4: '#3f9d4e', 5: '#12a08f', 6: '#2f80d6', 7: '#6163cf', 8: '#9a52c4', 9: '#cf4f93' };
  const hexrgb = h => [1, 3, 5].map(i => (parseInt(h.slice(i, i + 2), 16) / 255).toFixed(2)).join(' ');
  function buildPdf(header, grid, user, notes, palette, pkmn, pkjpg) {
    const PAGE = [595.276, 841.89], M = 52, CELL = 42, N = CELL * 9;
    const ox = (PAGE[0] - N) / 2, oy = PAGE[1] - M - 54 - N;
    const INK = '0.10 0.12 0.15', MID = '0.42 0.46 0.52', LIGHT = '0.72 0.75 0.79';
    let s = `BT /F1 15 Tf ${INK} rg 1 0 0 1 ${M} ${PAGE[1] - M + 4} Tm (${pdfEsc(header[0])}) Tj ET\n`;
    if (header[1]) s += `BT /F2 9.5 Tf ${MID} rg 1 0 0 1 ${M} ${PAGE[1] - M - 12} Tm (${pdfEsc(header[1])}) Tj ET\n`;
    // grid lines
    for (let i = 0; i <= 9; i++) {
      const w = i % 3 === 0 ? 1.6 : 0.6, col = i % 3 === 0 ? INK : LIGHT;
      const xp = (ox + i * CELL).toFixed(2), yp = (oy + i * CELL).toFixed(2);
      s += `q ${col} RG ${w} w ${xp} ${oy.toFixed(2)} m ${xp} ${(oy + N).toFixed(2)} l S Q\n`;
      s += `q ${col} RG ${w} w ${ox.toFixed(2)} ${yp} m ${(ox + N).toFixed(2)} ${yp} l S Q\n`;
    }
    const DIGW = 0.556; // Helvetica digit advance (per 1000 units)
    for (let i = 0; i < 81; i++) {
      const r = (i / 9) | 0, c = i % 9, x = ox + c * CELL, y = oy + (8 - r) * CELL;
      if (pkmn && pkjpg[grid[i]]) {
        const sz = 30;
        s += `q ${sz} 0 0 ${sz} ${(x + (CELL - sz) / 2).toFixed(2)} ${(y + (CELL - sz) / 2).toFixed(2)} cm /Im${grid[i]} Do Q\n`;
      } else if (grid[i]) {
        const size = 19, d = String(grid[i]), col = palette ? hexrgb(PDFPAL[grid[i]]) : INK;
        s += `BT /F1 ${size} Tf ${col} rg 1 0 0 1 ${(x + CELL / 2 - DIGW * size / 2).toFixed(2)} ${(y + CELL / 2 - size * 0.36).toFixed(2)} Tm (${d}) Tj ET\n`;
      } else if (pkmn && pkjpg[user[i]] && !grid[i]) {
        const sz = 27;
        s += `q ${sz} 0 0 ${sz} ${(x + (CELL - sz) / 2).toFixed(2)} ${(y + (CELL - sz) / 2).toFixed(2)} cm /Im${user[i]} Do Q\n`;
      } else if (user[i]) {
        const size = 19, d = String(user[i]), col = palette ? hexrgb(PDFPAL[user[i]]) : MID;
        s += `BT /F2 ${size} Tf ${col} rg 1 0 0 1 ${(x + CELL / 2 - DIGW * size / 2).toFixed(2)} ${(y + CELL / 2 - size * 0.36).toFixed(2)} Tm (${d}) Tj ET\n`;
      } else if (notes[i]) {
        const size = 8, cw = CELL / 3;
        for (let d = 1; d <= 9; d++) if (notes[i] & C.BITS[d]) {
          const col = (d - 1) % 3, row = ((d - 1) / 3) | 0;
          const tx = x + col * cw + cw / 2 - DIGW * size / 2, ty = y + CELL - (row + 1) * cw - size * 0.18;
          s += `BT /F2 ${size} Tf ${palette ? hexrgb(PDFPAL[d]) : MID} rg 1 0 0 1 ${tx.toFixed(2)} ${ty.toFixed(2)} Tm (${d}) Tj ET\n`;
        }
      }
    }

    const imgs = pkmn ? Object.keys(pkjpg).map(d => ({ d, bytes: pkjpg[d] })) : [];
    const xres = imgs.length ? ` /XObject << ${imgs.map((o, k) => `/Im${o.d} ${7 + k} 0 R`).join(' ')} >>` : '';
    const objs = [
      '<< /Type /Catalog /Pages 2 0 R >>',
      '<< /Type /Pages /Kids [3 0 R] /Count 1 >>',
      `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PAGE[0]} ${PAGE[1]}] /Resources << /Font << /F1 5 0 R /F2 6 0 R >>${xres} >> /Contents 4 0 R >>`,
      `<< /Length ${s.length} >>\nstream\n${s}endstream`,
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>',
      '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>',
      ...imgs.map(o => ({ bin: o.bytes, head: `<< /Type /XObject /Subtype /Image /Width 128 /Height 128 /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${o.bytes.length} >>`, stream: true }))
    ];
    const enc = new TextEncoder();
    let parts = [], len = 0, offsets = [];
    const add = str => { const b = enc.encode(str); parts.push(b); len += b.length; };
    add('%PDF-1.4\n');
    objs.forEach((o, i) => {
      offsets.push(len);
      const head = typeof o === 'string' ? o : o.head;
      add(`${i + 1} 0 obj\n${head}\n`);
      if (typeof o === 'object' && o.stream) { add('stream\n'); parts.push(o.bin); len += o.bin.length; add('\nendstream\n'); }
      add('endobj\n');
    });
    const xref = len;
    add(`xref
0 ${objs.length + 1}
0000000000 65535 f 
`);
    for (const o of offsets) add(String(o).padStart(10, '0') + ' 00000 n \n');
    add(`trailer
<< /Size ${objs.length + 1} /Root 1 0 R >>
startxref
${xref}
%%EOF
`);
    return parts;
  }
  const b64bytes = b64 => { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; };
  function exportPdf() {
    if (!S.grid) return;
    const tier = TIERS.find(t => t.id === S.tier);
    const name = S.rating && S.rating.name ? S.rating.name : tier.en.toUpperCase();
    const sub = [tier.en.toUpperCase(), `${C.clues(S.grid)} clues`, `${fmt(S.elapsed)} elapsed`, S.hints ? `${S.hints} hints` : 'no hints', S.rating && S.rating.name && S.rating.sub ? S.rating.by : null].filter(Boolean).join('  /  ');
    const jpgs = {}; if (SETS[S.icons]) for (const d in SETS[S.icons].jpg) jpgs[d] = b64bytes(SETS[S.icons].jpg[d]);
    const blob = new Blob(buildPdf([name, sub], S.grid, S.user, S.notes, S.palette, !!Object.keys(jpgs).length, jpgs), { type: 'application/pdf' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `sudoku-${tier.en}-${fmt(S.elapsed).replace(':', '')}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  window.__sudoku = { S, C, exportPdf, newPuzzle, TIERS, FAMOUS, input, select, doHint, doCheck, doUndo, doErase, render, done, setPalette, setPkmn, setIcons, fmt };

  setIcons(S.icons || 'colour');
  if (!restore()) newPuzzle(); else render();
})();

</script>
</body>
</html>
