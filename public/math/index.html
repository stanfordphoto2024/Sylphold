    if (mode === 5) {                        /* grams, one step */
      var g1 = R.int(rng, 200, 900), g2 = R.int(rng, 50, cap(g1 - 20, 50, 400));
      return I_num('A bag of apples weighs ' + g1 + ' grams. ' + w + ' uses ' + g2 +
        ' grams for a pie. How many grams are left?', g1 - g2, {
          teach: 'Mass in the same unit is subtracted like any other quantity; grams stay grams.',
          explain: ['Start with ' + g1 + ' grams and take away ' + g2 + '.',
            g1 + ' - ' + g2 + ' = ' + (g1 - g2) + '.',
            '<b>' + (g1 - g2) + '</b> grams are left.'],
          b: 0.1
        });
    }
    if (mode === 6) {                        /* which unit fits */
      var item6 = pick(rng, [['a paper clip', 'grams'], ['a full bathtub of water', 'litres'], ['a textbook', 'grams'],
        ['a big bag of dog food', 'kilograms'], ['a glass of milk', 'millilitres'], ['a newborn puppy', 'grams'],
        ['the water in a fish tank', 'litres'], ['a backpack', 'kilograms']]);
      return MC(rng, 'Which unit best measures ' + item6[0] + '?', item6[1],
        ['grams', 'litres', 'millilitres', 'kilograms'].filter(function (u) { return u !== item6[1]; }).slice(0, 3), {
          teach: 'Grams and millilitres are for small amounts, kilograms and litres for big ones.',
          explain: ['We are measuring ' + item6[0] + ', so pick the unit whose size fits the amount.',
            'A gram is about the mass of a paper clip; a litre is about 4 large bottles.',
            'The best unit is <b>' + item6[1] + '</b>.']
        });
    }
    if (mode === 7) {                        /* best estimate */
      var thing7 = pick(rng, [['a dictionary', 1500, 'grams'], ['a feather', 2, 'grams'], ['a bag of flour', 2, 'kilograms'],
        ['a pencil', 8, 'grams'], ['a water bottle', 500, 'millilitres'], ['a pumpkin', 4, 'kilograms']]);
      return MC(rng, 'Which is the best estimate for ' + thing7[0] + '?', thing7[1] + ' ' + thing7[2],
        [thing7[1] * 10 + ' ' + thing7[2], Math.max(1, Math.round(thing7[1] / 10)) + ' ' + thing7[2],
        thing7[1] + ' ' + (thing7[2] === 'grams' ? 'kilograms' : 'grams')], {
          teach: 'Anchor on one gram or one litre, then scale — the right size beats a precise-looking wrong number.',
          explain: ['A gram is tiny and a kilogram is about the mass of a large textbook.',
            'For ' + thing7[0] + ', ' + thing7[1] + ' ' + thing7[2] + ' is the sensible size.',
            'Multiplying or dividing that by 10 overshoots, so the best estimate is <b>' + thing7[1] + ' ' + thing7[2] + '</b>.'],
          b: 0.5
        });
    }
    if (mode === 8) {                        /* kg vs g judgement */
      var kg9 = R.int(rng, 2, 9);
      return I_bool(kg9 + ' kilograms is more than ' + (kg9 * 1000) + ' grams.', false, {
        teach: 'One kilogram is exactly 1000 grams, so changing units changes the number, not the mass.',
        explain: ['1 kilogram = 1000 grams.', kg9 + ' kilograms = ' + kg9 + ' × 1000 = ' + (kg9 * 1000) + ' grams.',
          'That is exactly the same mass, not more, so the answer is <b>no</b>.'],
        b: 0.4
      });
    }
    if (mode === 9) {                        /* minutes vs hours */
      var hr = R.int(rng, 1, 3), extra = pick(rng, [15, 30, 45, 90, 120]);
      return I_cmp(extra + ' minutes  ○  ' + hr + ' hours', extra, hr * 60, {
        teach: 'Change both sides to the same unit before comparing.',
        explain: ['' + hr + ' hours = ' + (hr * 60) + ' minutes.',
          extra + ' minutes compared with ' + (hr * 60) + ' minutes.',
          'So the symbol is <b>' + (extra < hr * 60 ? '&lt;' : (extra > hr * 60 ? '&gt;' : '=')) + '</b>.'],
        b: 0.5
      });
    }
    /* mode 10 — two beakers poured together */
    var b10 = pick(rng, [120, 250, 340, 480, 560]), b10b = pick(rng, [130, 220, 360, 450, 270]);
    return I_num('One beaker holds ' + b10 + ' millilitres and another holds ' + b10b +
      ' millilitres. Both are poured into a jug. How many millilitres are in the jug?', b10 + b10b, {
        visual: V.bars([{ label: 'beaker 1', v: b10 }, { label: 'beaker 2', v: b10b }], { yMax: 600, label: 'millilitres' }),
        teach: 'Same unit on both measures means the amounts can be added straight away.',
        explain: ['Both beakers are measured in millilitres.', b10 + ' + ' + b10b + ' = ' + (b10 + b10b) + '.',
          'The jug holds <b>' + (b10 + b10b) + '</b> millilitres.'],
        b: 0.2
      });
  };
  G('g3-md-measure', withLead(gen_g3_md_measure, LEAD));

  /* ============ 3.MD.3-4  scaled graphs and line plots with fractions ==== */
  /* lvl 1-2  read one bar, how many more / less.
     lvl 3    scaled bar graphs (each square stands for 5 or 10), two-step
              totals, line plots marked in halves and fourths.
     lvl 4-5  convert a scale into real counts and judge a claim about the data. */
  var gen_g3_md_plots = function (rng, lvl) {
    var mode = R.int(rng, 0, lvl >= 4 ? 9 : lvl >= 3 ? 7 : 3);
    var cats = sample(rng, ['soccer', 'swimming', 'art', 'reading', 'chess', 'dance', 'gardening', 'cooking'], 4);
    var scale = lvl >= 3 ? pick(rng, [5, 10]) : 1;
    var squares = cats.map(function () { return R.int(rng, 2, 9); });
    var vals = squares.map(function (s) { return s * scale; });
    var data = cats.map(function (c, i) { return { label: c, v: vals[i] }; });
    var glabel = pick(rng, ['favourite club', 'pets', 'books read', 'cans collected']);
    var yTop = function (arr) { return Math.max(Math.max.apply(null, arr) * 1.2, scale); };

    if (mode === 0) {                        /* read a bar */
      var pick0 = R.int(rng, 0, 3);
      return I_num('From the graph: how many ' + glabel + ' are ' + cats[pick0] + '?', vals[pick0], {
        visual: V.bars(data, { yMax: yTop(vals), label: glabel }),
        teach: 'Read the height of the bar against the scale, then say the number with its unit.',
        explain: ['Find the bar labelled <b>' + cats[pick0] + '</b>.',
          'Its top lines up with ' + vals[pick0] + ' on the scale.',
          'So ' + cats[pick0] + ' has <b>' + vals[pick0] + '</b>.'],
        b: -0.4
      });
    }
    if (mode === 1) {                        /* how many more */
      var hi1 = R.int(rng, 0, 3), lo1 = (hi1 + 1 + R.int(rng, 0, 2)) % 4;
      if (vals[hi1] === vals[lo1]) vals[hi1] = vals[lo1] + scale;
      return I_num('How many more ' + glabel + ' are ' + cats[hi1] + ' than ' + cats[lo1] + '?', Math.abs(vals[hi1] - vals[lo1]), {
        visual: V.bars([data[hi1], data[lo1]], { yMax: yTop([vals[hi1], vals[lo1]]), label: 'compare the heights' }),
        teach: 'A comparison question is a subtraction of the two bar values.',
        explain: ['' + cats[hi1] + ' is ' + vals[hi1] + ' and ' + cats[lo1] + ' is ' + vals[lo1] + '.',
          Math.max(vals[hi1], vals[lo1]) + ' - ' + Math.min(vals[hi1], vals[lo1]) + ' = ' + Math.abs(vals[hi1] - vals[lo1]) + '.',
          'The difference is <b>' + Math.abs(vals[hi1] - vals[lo1]) + '</b>.'],
        b: -0.1
      });
    }
    if (mode === 2) {                        /* scale conversion */
      var sq2 = R.int(rng, 3, 9);
      return I_num('On a scaled bar graph each square stands for ' + scale + ' ' + glabel +
        '. A bar is ' + sq2 + ' squares tall. How many is that?', sq2 * scale, {
          visual: V.bars([{ label: cats[0], v: sq2 }], { yMax: 10, label: 'each square = ' + scale }),
          teach: 'A scaled graph counts groups, so multiply the squares by the value of one square.',
          explain: ['One square = ' + scale + '.', sq2 + ' squares = ' + sq2 + ' groups of ' + scale + '.',
            sq2 + ' × ' + scale + ' = <b>' + (sq2 * scale) + '</b>.'],
          b: 0.3
        });
    }
    if (mode === 3) {                        /* two-step total from the graph */
      var a3 = R.int(rng, 0, 3), b3 = (a3 + 1 + R.int(rng, 0, 2)) % 4;
      return I_num('How many ' + glabel + ' are ' + cats[a3] + ' and ' + cats[b3] + ' together?', vals[a3] + vals[b3], {
        visual: V.bars([data[a3], data[b3]], { yMax: yTop([vals[a3], vals[b3]]), label: 'two categories' }),
        teach: 'A total uses every value, so read both bars before adding.',
        explain: ['' + cats[a3] + ' = ' + vals[a3] + ', ' + cats[b3] + ' = ' + vals[b3] + '.',
          vals[a3] + ' + ' + vals[b3] + ' = ' + (vals[a3] + vals[b3]) + '.',
          'Together that is <b>' + (vals[a3] + vals[b3]) + '</b>.'],
        b: 0.2
      });
    }
    if (mode === 4) {                        /* most / least */
      var maxI = vals.indexOf(Math.max.apply(null, vals));
      return MC(rng, 'Which ' + glabel + ' is the most popular?', cats[maxI],
        cats.filter(function (c, i) { return i !== maxI; }).slice(0, 3), {
          visual: V.bars(data, { yMax: yTop(vals), label: glabel }),
          teach: 'The tallest bar is the greatest value, whatever the scale happens to be.',
          explain: ['Compare the four heights: ' + cats.map(function (c, i) { return c + ' ' + vals[i]; }).join(', ') + '.',
            'The tallest is ' + cats[maxI] + ' at ' + vals[maxI] + '.',
            'So the most popular is <b>' + cats[maxI] + '</b>.'],
          b: 0
        });
    }
    if (mode === 5) {                        /* line plot total */
      var labels = ['0', '1', '2', '3'];
      var marks = labels.map(function () { return R.int(rng, 1, 8); });
      var total = marks.reduce(function (a, b) { return a + b; }, 0);
      return I_num('A line plot of seed lengths is marked in half inches. How many seeds were measured in all?', total, {
        visual: V.table(['length (in)', 'X marks'], labels.map(function (L, i) {
          return [L, Array.apply(null, Array(marks[i])).map(function () { return '✕'; }).join(' ')];
        })),
        teach: 'Every X on a line plot is one measurement, so the total is the count of all the Xs.',
        explain: ['Count the Xs above each mark: ' + labels.map(function (L, i) { return L + ' → ' + marks[i]; }).join(', ') + '.',
          'Add them: ' + marks.join(' + ') + ' = ' + total + '.',
          '<b>' + total + '</b> seeds were measured.'],
        b: 0.2
      });
    }
    if (mode === 6) {                        /* line plot: most common length */
      var labels6 = ['1 1/2', '2', '2 1/2', '3'];
      var marks6 = labels6.map(function () { return R.int(rng, 1, 9); });
      var top6 = marks6.indexOf(Math.max.apply(null, marks6));
      return MC(rng, 'The line plot shows pencil lengths in fourths of an inch. Which length was measured most often?',
        labels6[top6], labels6.filter(function (_, i) { return i !== top6; }).slice(0, 3), {
          visual: V.table(['length (in)', 'X marks'], labels6.map(function (L, i) {
            return [L, Array.apply(null, Array(marks6[i])).map(function () { return '✕'; }).join(' ')];
          })),
          teach: 'The column with the most Xs is the most frequent measurement.',
          explain: ['Count the Xs: ' + labels6.map(function (L, i) { return L + ' → ' + marks6[i]; }).join(', ') + '.',
            'The most Xs sit above ' + labels6[top6] + ' (' + marks6[top6] + ' of them).',
            'So the most common length is <b>' + labels6[top6] + '</b> inches.'],
          b: 0.4
        });
    }
    if (mode === 7) {                        /* judge a claim about the graph */
      var hi7 = vals.indexOf(Math.max.apply(null, vals)), lo7 = vals.indexOf(Math.min.apply(null, vals));
      if (vals[hi7] === vals[lo7]) vals[lo7] = vals[hi7] - scale;
      var truthful = chance(rng, 0.5);
      var claim = truthful ? cats[hi7] + ' has more than ' + cats[lo7] : cats[lo7] + ' has more than ' + cats[hi7];
      return I_bool('From the graph: ' + claim + ' — true or false?', truthful, {
        visual: V.bars(data, { yMax: yTop(vals), label: glabel }),
        teach: 'Test a claim against the numbers on the graph, not against what you expect.',
        explain: ['' + cats[hi7] + ' = ' + vals[hi7] + ' and ' + cats[lo7] + ' = ' + vals[lo7] + '.',
          (truthful ? cats[hi7] : cats[lo7]) + ' is the larger value (' + Math.max(vals[hi7], vals[lo7]) + ').',
          'So the claim is <b>' + (truthful ? 'true' : 'false') + '</b>.'],
        b: 0.3
      });
    }
    if (mode === 8) {                        /* difference on the line plot */
      var labels8 = ['1/4', '1/2', '3/4', '1'];
      var marks8 = labels8.map(function () { return R.int(rng, 3, 9); });
      var hi8 = marks8.indexOf(Math.max.apply(null, marks8)), lo8 = marks8.indexOf(Math.min.apply(null, marks8));
      if (hi8 === lo8) { marks8[(hi8 + 1) % 4] = marks8[hi8] - 2; lo8 = (hi8 + 1) % 4; }
      return I_num('On a line plot marked in fourths, how many more measurements are above ' + labels8[hi8] +
        ' than above ' + labels8[lo8] + '?', marks8[hi8] - marks8[lo8], {
          visual: V.table(['measurement (in)', 'X marks'], labels8.map(function (L, i) {
            return [L, Array.apply(null, Array(marks8[i])).map(function () { return '✕'; }).join(' ')];
          })),
          teach: 'Compare the counts of Xs; the fraction labels only name the columns.',
          explain: ['Above ' + labels8[hi8] + ' there are ' + marks8[hi8] + ' Xs; above ' + labels8[lo8] + ' there are ' + marks8[lo8] + '.',
            marks8[hi8] + ' - ' + marks8[lo8] + ' = ' + (marks8[hi8] - marks8[lo8]) + '.',
            'That is <b>' + (marks8[hi8] - marks8[lo8]) + '</b> more measurements.'],
          b: 0.5
        });
    }
    /* mode 9 — scale reasoning the other way */
    var sq9 = R.int(rng, 3, 9), total9 = sq9 * scale;
    return MC(rng, 'Each square on a graph stands for ' + scale + ' ' + glabel +
      '. If a category has ' + total9 + ', how many squares are drawn?', sq9,
      [sq9 + 1, sq9 - 1, total9], {
        visual: V.bars([{ label: cats[0], v: sq9 }], { yMax: 10, label: 'each square = ' + scale }),
        teach: 'To draw a scaled bar, divide the real number by the value of one square.',
        explain: ['One square = ' + scale + ', so the squares are ' + total9 + ' ÷ ' + scale + '.',
          total9 + ' ÷ ' + scale + ' = ' + sq9 + '.',
          'Draw <b>' + sq9 + '</b> squares.'],
        b: 0.6
      });
  };
  G('g3-md-plots', withLead(gen_g3_md_plots, LEAD));

  /* ============ 3.G.1-2  quadrilateral hierarchy & equal-area parts ======== */
  /* lvl 1-2  name shapes by attribute, partition into equal parts.
     lvl 3    recognise the quadrilateral family and express each equal part as
              a unit fraction of the whole.
     lvl 4-5  judge hierarchy claims, and see that equal area does not need the
              same outline. */
  var QUAD = ['rhombus', 'rectangle', 'square', 'trapezoid'];
  var NOT_QUAD = ['circle', 'triangle', 'pentagon', 'hexagon', 'oval'];
  var gen_g3_g_shapes = function (rng, lvl) {
    var mode = R.int(rng, 0, lvl >= 4 ? 9 : lvl >= 3 ? 7 : 3);
    var parts = pick(rng, [2, 3, 4, 6, 8]);

    if (mode === 0) {                        /* which are quadrilaterals */
      var q0 = pick(rng, QUAD), bad0 = pick(rng, NOT_QUAD), bad0b = pick(rng, NOT_QUAD.filter(function (x) { return x !== bad0; }));
      return MC(rng, 'Which shape is a quadrilateral?', q0, [bad0, bad0b], {
        teach: 'A quadrilateral is any closed shape with exactly four straight sides.',
        explain: ['Count straight sides: a ' + q0 + ' has four.',
          'A ' + bad0 + ' and a ' + bad0b + ' do not have four straight sides.',
          'So the quadrilateral is <b>' + q0 + '</b>.'],
        b: -0.4
      });
    }
    if (mode === 1) {                        /* the shared attribute */
      return MC(rng, 'Rhombuses, rectangles and squares all belong to one bigger group. Which attribute defines that group?',
        'four straight sides', ['four equal sides', 'four right angles', 'two pairs of equal sides'], {
          teach: 'A shared attribute defines a category; extra attributes define smaller groups inside it.',
          explain: ['Every rhombus, rectangle and square has four straight sides.',
            'Only some of them have equal sides or right angles.',
            'The attribute that defines the group <b>quadrilaterals</b> is <b>four straight sides</b>.']
        });
    }
    if (mode === 2) {                        /* hierarchy true */
      return I_bool('Every rectangle is a quadrilateral.', true, {
        teach: 'Shapes inside a category keep the category attributes, so a rectangle is always a quadrilateral.',
        explain: ['A quadrilateral needs four straight sides.', 'A rectangle has four straight sides and four right angles.',
          'It meets the definition, so <b>yes</b>.'],
        b: 0
      });
    }
    if (mode === 3) {                        /* hierarchy false or true */
      var claim3 = pick(rng, [['square', 'rhombus'], ['rectangle', 'triangle'], ['trapezoid', 'hexagon']]);
      var isTrue3 = claim3[0] === 'square' && claim3[1] === 'rhombus';
      return I_bool('Every ' + claim3[0] + ' is a ' + claim3[1] + '.', isTrue3, {
        teach: 'Check the definition of the bigger group before you agree that a shape belongs to it.',
        explain: ['A ' + claim3[1] + ' is defined by its own attributes.',
          isTrue3 ? 'A square has four equal sides, which is exactly what a rhombus needs.'
            : 'A ' + claim3[0] + ' does not have the attributes a ' + claim3[1] + ' needs.',
          'So the claim is <b>' + (isTrue3 ? 'true' : 'false') + '</b>.'],
        b: 0.5
      });
    }
    if (mode === 4) {                        /* equal parts -> unit fraction */
      return I_frac('A ' + pick(rng, ['rectangular garden', 'banner', 'chocolate bar', 'paper strip']) +
        ' is divided into ' + parts + ' parts with equal area. What fraction of the whole is one part?', 1, parts, {
        answerText: '1/' + parts,
          visual: V.frac([{ n: 1, d: parts, label: 'one of ' + parts + ' equal-area parts' }]),
          teach: 'Partitioning a shape into n equal-area parts makes each part 1/n of the whole.',
          explain: ['The whole is split into <b>' + parts + '</b> parts of equal area.',
            'One part is one of those ' + parts + ' equal pieces.',
            'So one part is <b>1/' + parts + '</b> of the whole.'],
          b: -0.2
        });
    }
    if (mode === 5) {                        /* area of one part */
      var area5 = parts * R.int(rng, 2, 6);
      return I_num('A rectangle has an area of ' + area5 + ' square units and is cut into ' + parts +
        ' parts with equal area. How many square units is each part?', area5 / parts, {
          visual: V.frac([{ n: 1, d: parts, label: 'one part' }]),
          teach: 'Equal-area parts divide the total area evenly, so each part is the area shared by the number of parts.',
          explain: ['Total area is <b>' + area5 + '</b> square units in <b>' + parts + '</b> equal parts.',
            area5 + ' ÷ ' + parts + ' = ' + (area5 / parts) + '.',
            'Each part is <b>' + (area5 / parts) + '</b> square units.'],
          b: 0.3
        });
    }
    if (mode === 6) {                        /* shaded equal parts */
      var n6 = R.int(rng, 1, parts - 1);
      return I_frac('A shape is divided into ' + parts + ' parts of equal area and ' + n6 +
        ' of them are shaded. What fraction is shaded?', n6, parts, {
        answerText: n6 + '/' + parts,
          visual: V.frac([{ n: n6, d: parts, label: n6 + ' of ' + parts }]),
          teach: 'The fraction names how many equal-area parts you have out of how many make the whole.',
          explain: ['The whole has <b>' + parts + '</b> equal-area parts.',
            '<b>' + n6 + '</b> of them are shaded.',
            'The shaded fraction is <b>' + n6 + '/' + parts + '</b>.'],
          b: 0
        });
    }
    if (mode === 7) {                        /* equal area, different shape */
      return I_bool('Two parts of the same shape can have the same area even if they look different.', true, {
        teach: 'Area counts the square units inside, so different-looking parts can still match in area.',
        explain: ['A long thin part and a squat part can each cover the same number of unit squares.',
          'Area does not depend on the outline, only on how much is covered.',
          'So <b>yes</b>, they can be equal in area.'],
        b: 0.6
      });
    }
    if (mode === 8) {                        /* the most-restricted shape */
      var s8 = pick(rng, QUAD);
      return MC(rng, 'Which quadrilateral must have four right angles AND four equal sides?', 'square',
        [s8 === 'square' ? 'rectangle' : s8, s8 === 'square' ? 'rhombus' : 'trapezoid'], {
          teach: 'More attributes mean a smaller group: four right angles and four equal sides leaves only squares.',
          explain: ['Four right angles: rectangles and squares qualify.',
            'Four equal sides as well: only the square still qualifies.',
            'The shape is the <b>square</b>.'],
          b: 0.4
        });
    }
    if (mode === 9) {                        /* partition judgement */
      var p9 = pick(rng, [4, 6, 8]);
      return MC(rng, 'A ' + pick(rng, ['cookie tray', 'garden bed', 'poster']) + ' is cut into ' + p9 +
        ' parts. Which cut gives each part 1/' + p9 + ' of the whole?',
        p9 + ' parts with equal area', [p9 + ' parts of different sizes', p9 + ' parts with the same perimeter'], {
          visual: V.frac([{ n: 1, d: p9, label: 'equal-area parts' }]),
          teach: 'Unit fractions of a shape need equal area, not equal outline.',
          explain: ['1/' + p9 + ' means one part out of ' + p9 + ' parts of the same area.',
            'Same perimeter does not force the areas to match.',
            'So the cut must give <b>' + p9 + ' parts with equal area</b>.'],
          b: 0.7
        });
    }
    /* mode 10 — compare two equal-area partitions of one whole */
    var pA = pick(rng, [2, 4]), pB = pick(rng, [4, 8].filter(function (x) { return x !== pA; }));
    return I_cmp('Same whole:  1/' + pA + ' of it  ○  1/' + pB + ' of it', 1 / pA, 1 / pB, {
      visual: V.frac([{ n: 1, d: pA, label: '1/' + pA }, { n: 1, d: pB, label: '1/' + pB }]),
      teach: 'Both fractions refer to the same whole, so more parts means each part is smaller.',
      explain: ['' + pA + ' equal parts give pieces of size 1/' + pA + '.',
        pB + ' equal parts give pieces of size 1/' + pB + '.',
        'So the symbol is <b>' + (1 / pA < 1 / pB ? '&lt;' : (1 / pA > 1 / pB ? '&gt;' : '=')) + '</b>.'],
      b: 0.5
    });
  };
  G('g3-g-shapes', withLead(gen_g3_g_shapes, LEAD));
})();


</script>
<script>
/* =============================================================================
 * 20-ui.js — MathPath browser UI. Renders items, models, feedback, plan,
 * ladder, report and the placement probe. Depends on 00-core, 01-skills,
 * 02-engine (window.MathPath) and the generators. No dependencies, no network.
 * ============================================================================= */
(function (root) {
  'use strict';

  var doc = document, win = root, NS = 'http://www.w3.org/2000/svg';
  var M = root.MathPath;                       // engine API (02-engine.js)
  var checkSpec = root.checkSpec, diagnose = root.diagnose;
  var nfmt = root.nfmt, answerTextFor = root.answerTextFor;

  /* ------------------------------------------------------------ dom ------- */
  function h(tag, props, kids) {
    var n = doc.createElement(tag), k;
    if (props) for (k in props) {
      if (!props.hasOwnProperty(k)) continue;
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;

  }

  function submit() {
    if (S.answered) return;
    var raw = currentRaw();
    if (!raw) { toast('Type or pick your answer first'); return; }
    var res = checkSpec(S.item.spec, raw);
    if (res.ok) { finish(true); return; }
    S.attempts++;
    var notes = diagnose(S.item, raw) || [];
    S.notes = notes;
    var fb = $('#view #feedback');
    var kind = widgetKind(S.item);
    if (kind === 'choice' || kind === 'compare') {
      $$('#view .opt').forEach(function (b) { if (+b.getAttribute('data-i') === S.picked) b.classList.add('no'); });
    } else {
      $$('#view input.fld').forEach(function (i) { i.classList.add('no'); });
    }
    if (S.attempts >= 2) { finish(false); return; }
    clear(fb).appendChild(h('div', { class: 'fb no' }, [
      h('div', { class: 'head' }, ['Not yet — try again']),
      notes.length ? h('div', { class: 'note', html: esc(notes[0]) }) : h('div', { class: 'note', text: 'Check the last step: what did you do to the numbers?' })
    ]));
    S.picked = null;
    $$('#view .opt').forEach(function (b) { b.classList.remove('sel'); });
    renderActions();
    var inp = $('#view #ans'); if (inp) { inp.value = ''; inp.focus(); }
    beep(false);
  }

  function finish(ok, skipped) {
    if (S.answered || !S.item) return;
    S.answered = true;
    S.revealed = true;
    var rec;
    if (S.item.diag) {
      rec = { p: E.prob(S.item.b), status: E.statusOf(S.item.skill) };
      var done = null;
      try { done = E.diagAnswer(S.item, ok); } catch (e) { done = null; }
      if (done) S.diagReport = done;
    } else {
      rec = E.record(S.item, ok);
    }
    rec.ok = ok; rec.skipped = !!skipped;
    S.lastRec = rec;
    E.save();
    beep(ok);
    revealAnswer();
    renderActions();
    renderHeader();
    /* the probe counter is live state: redraw it here or it freezes on whatever
     * number the view happened to render last */
    if (S.item.diag) renderProbeProgress();
  }

  function revealAnswer() {
    var fb = $('#view #feedback'); if (!fb || !S.item) return;
    var item = S.item, ok = S.lastRec && S.lastRec.ok;
    var kind = widgetKind(item);
    if (kind === 'choice' || kind === 'compare') {
      var cs = optionList(item, kind);
      var want = item.answerText != null ? String(item.answerText)
        : (item.spec && item.spec.text != null ? String(item.spec.text) : '');
      var right = cs.indexOf(want);
      if (right < 0 && item.spec && item.spec.k === 'choice' && item.spec.i != null) right = item.spec.i;
      $$('#view .opt').forEach(function (b) {
        var i = +b.getAttribute('data-i');
        if (i === right) b.classList.add('ok');
      });
    } else {
      $$('#view input.fld').forEach(function (i) { i.classList.remove('no'); i.classList.add(ok ? 'ok' : ''); });
    }
    var notes = (!ok && S.notes.length) ? S.notes : [];
    clear(fb).appendChild(h('div', { class: 'fb ' + (ok ? 'ok' : 'no') }, [
      h('div', { class: 'head' }, [ok ? '✓ Correct' : (S.lastRec && S.lastRec.skipped ? 'Skipped' : 'Not quite')]),
      h('div', { class: 'ans-line', html: 'Answer: <b>' + esc(item.answerText || answerTextFor(item.spec)) + '</b>' + (item.unit ? ' ' + esc(item.unit) : '') }),
      notes.map(function (n) { return h('div', { class: 'note', html: esc(n) }); }),
      h('ol', { class: 'steps', id: 'steps' }, (item.explain || []).map(function (st) { return h('li', { html: st }); })),
      item.teach ? h('div', { class: 'teach', html: esc(item.teach) }) : null
    ]));
  }
  /* ------------------------------------------------ reteach after wrong -- */
  function startReteach() {
    var list = [];
    try { list = E.reteach(S.item.skill, S.item.lvl || 3) || []; } catch (e) { list = []; }
    var retries = list.filter(function (x) { return x && x.role !== 'example'; });
    S.queue = retries.slice(0, 2);
    S.reteachDone = true;
    next();
  }

  /* --------------------------------------------------------------- queue -- */
  /* An item the learner can never finish must not reach the screen: a card with
   * an empty answer spec looks exactly like a frozen app. `next` drops it and
   * asks for another one. */
  function answerable(item) {
    if (!item || !item.spec) return false;
    var k = item.spec.k;
    if (k === 'list') return !!(item.spec.vals && item.spec.vals.length);
    if (k === 'choice') return optionList(item, 'choice').length >= 2 ||
      (item.spec.text != null && String(item.spec.text).trim() !== '');
    if (k === 'str') return !!(item.spec.pats && item.spec.pats.length);
    if (k === 'n') return item.spec.v == null || isFinite(item.spec.v);
    if (k === 'frac') return !!item.spec.d;
    return true;
  }

  function next() {
    S.attempts = 0; S.answered = false; S.revealed = false; S.picked = null;
    S.notes = []; S.lastRec = null; S.reteachDone = false;
    /* A finished probe must never keep serving questions here: the practice item
     * the engine would hand back is not a probe item, so the counter stops while
     * the questions keep coming — the learner watches a frozen "23 / 26". */
    if (S.view === 'diag' && !E.diagActive()) { showReport(); return; }
    if (E.diagActive()) {
      var dit = null;
      try { dit = E.diagNext(); } catch (e) { dit = null; }
      S.item = dit;
      if (S.view === 'diag') { render(); return; }
      renderItem(); renderHeader();
      return;
    }
    if (S.queue.length) {
      /* a queued reteach item that cannot be answered must not be shown */
      var q = null;
      while (S.queue.length) { q = S.queue.shift(); if (answerable(q)) break; q = null; }
      if (q) { S.item = q; renderItem(); renderHeader(); return; }
    }
    var opts = S.manual ? { skillId: S.manual, why: 'manual' } : null;
    var guard = 0, item = null;
    while (guard++ < 12 && !item) {
      try { item = E.nextItem(opts); } catch (e) { item = null; }
      if (item && !answerable(item)) item = null;    // broken item: never shown to a learner
      if (!item && opts) { S.manual = null; opts = null; }
      if (!item && !opts) break;
    }
    S.item = item;
    renderItem();
    renderHeader();
  }

        h('span', { class: 'pill accent', text: p.bandLabel || 'start' }),
        st.sess.streak ? h('span', { class: 'pill good', text: '🔥 ' + st.sess.streak }) : null,
        st.sess.asked ? h('span', { class: 'pill', text: acc + '%' }) : null
      ]),
      h('nav', { class: 'tabs' }, [
        tab('practice', 'Practice'), tab('plan', 'Plan'), tab('ladder', 'Ladder'), tab('report', 'Report'),
        h('button', { type: 'button', class: S.view === 'diag' ? 'on' : '', on: { click: function () { location.hash = '#diag'; } }, text: E.diagActive() ? 'Probe ●' : 'Probe' })
      ])
    ]));
  }
  function tab(name, label) {
    return h('button', {
      type: 'button', class: S.view === name ? 'on' : '', text: label,
      on: { click: function () { location.hash = '#' + name; } }
    });
  }

  /* -------------------------------------------------------------- render - */
  function render() {
    renderHeader();
    if (S.view === 'plan') viewPlan();
    else if (S.view === 'ladder') viewLadder();
    else if (S.view === 'report') viewReport();
    else if (S.view === 'diag') viewDiag();
    else viewPractice();
  }

  function route() {
    var v = (location.hash || '#practice').replace(/^#\/?/, '') || 'practice';
    if (v.indexOf('practice/') === 0) { S.manual = v.slice(9); S.item = null; S.queue = []; v = 'practice'; }
    if (['practice', 'plan', 'ladder', 'report', 'diag'].indexOf(v) < 0) v = 'practice';
    if (v !== S.view) { S.view = v; }
    render();
  }

  /* --------------------------------------------------------------- sound - */
  var AC = null;
  function beep(ok) {
    if (!E || !E.st.settings || !E.st.settings.sound) return;
    try {
      AC = AC || new (win.AudioContext || win.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = ok ? 660 : 220;
      g.gain.value = 0.05; o.connect(g); g.connect(AC.destination);
      o.start(); o.frequency.exponentialRampToValueAtTime(ok ? 990 : 160, AC.currentTime + 0.12);
      setTimeout(function () { o.stop(); }, 150);
    } catch (e) { }
  }
  var toastT = null;
  function toast(msg) {
    var t = $('#toast'); if (!t) return;
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.classList.remove('on'); }, 2200);
  }

  /* ------------------------------------------------------------ keyboard - */
  function keys(ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var tag = (ev.target && ev.target.tagName || '').toLowerCase();
    if (S.view !== 'practice' && S.view !== 'diag') return;
    if (ev.key === 'Enter') {
      ev.preventDefault();
      if (!S.answered) { if (currentRaw()) submit(); } else next();
      return;
    }
    if (!S.answered && /^[1-6]$/.test(ev.key) && (widgetKind(S.item || {}) === 'choice' || widgetKind(S.item || {}) === 'compare')) {
      var i = +ev.key - 1, cs = optionList(S.item || {}, widgetKind(S.item || {}));
      if (i < cs.length) { ev.preventDefault(); pick(i); }
      return;
    }
    if ((ev.key === 'h' || ev.key === 'H') && !S.answered && tag !== 'input') {
      var hb = $('#view .hintbox');
      if (!hb) add($('#view #feedback') || $('#view'), h('div', { class: 'hintbox', html: esc((S.item && (S.item.hint || S.item.teach)) || '') }));
    }
  }

  /* ---------------------------------------------------------------- boot -- */
  function boot() {
    if (!M || !M.createEngine) {
      var v0 = $('#view');
      if (v0) clear(v0).appendChild(h('div', { class: 'card' }, [h('h2', { text: 'Engine failed to load' }), h('div', { class: 'muted', text: 'MathPath.createEngine is missing — the script order in this file is wrong.' })]));
      return;
    }
    var state = null;
    try { state = M.load ? M.load() : null; } catch (e) { state = null; }
    if (!state) { try { state = M.blankState(); } catch (e) { state = null; } }
    E = M.createEngine({ state: state, rng: Math.random });
    if (!E.st.settings) E.st.settings = { autoNext: true, sound: false, reviewShare: 0.22 };
    win.addEventListener('hashchange', route);
    doc.addEventListener('keydown', keys);
    route();
  }

  root.MathPathUI = {
    boot: boot, render: render, renderVisual: renderVisual, buildAnswer: buildAnswer,
    DRAW: DRAW, state: S, engine: function () { return E; }, toast: toast
  };

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  var v = document.getElementById('view');
  if (!window.MathPathUI) {
    v.innerHTML = '<div class="card"><h2>The interface did not load</h2><p class="muted">' +
      'window.MathPathUI is missing — this HTML file was assembled in the wrong order or truncated.</p></div>';
    return;
  }
  if (window.MathPathUI.state) window.MathPathUI.boot();
})();
</script>
</body>
