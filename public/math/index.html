        teach: 'A digit in the tens place stands for that many tens, not that many ones.',
        explain: ['The ' + tens + ' sits in the tens place of ' + n + '.', 'Tens place means ' + tens + ' × 10 = ' + tens * 10 + '.',
          'So the claim of ' + claim + ' is <b>' + (claim === tens * 10 ? 'correct' : 'not correct') + '</b>.'],
        b: 0.6
      });
    }
    if (mode === 8) {
      var wrong = [n + 10, Math.max(1, n - 1), n + 1];
      return MC(rng, 'Which number is ' + tens + ' tens and ' + ones + ' ones?', n, wrong, {
        teach: 'Multiply the tens digit by 10, then add the ones.',
        explain: [tens + ' tens = ' + tens * 10, tens * 10 + ' + ' + ones + ' = ' + n, 'Answer: <b>' + n + '</b>'],
        b: 0.5
      });
    }
    return I_num('Write the number: ' + tens * 10 + ' + ' + ones + ' =', n, {
      visual: V.blocks(0, tens, ones),
      teach: 'Expanded form adds the tens part and the ones part to rebuild the number.',
      explain: [tens * 10 + ' is ' + tens + ' tens.', 'Add ' + ones + ' ones.', 'Number: <b>' + n + '</b>'],
      b: 0.2
    });
  });

  /* --------------------------------------------- K.MD.1-2 measurement ------ */
  G('k-md-measure', function (rng, lvl) {
    var items = ['crayon', 'pencil', 'strip of paper', 'ribbon', 'straw', 'pipe cleaner', 'bookmark'];
    var things = ['paper clips', 'cubes', 'buttons', 'pattern blocks', 'links'];
    var item = R.pick(rng, items), unit = R.pick(rng, things);
    var mode = R.int(rng, 0, lvl <= 2 ? 2 : 4);
    var n = R.int(rng, lvl <= 2 ? 2 : 3, lvl <= 2 ? 6 : 9), other = R.int(rng, 1, 9);

    if (mode === 0) {
      return I_num('A ' + item + ' is measured with ' + unit + '. It spans ' + n + ' ' + unit +
        '. How many ' + unit + ' long is it?', n, {
        sub: 'Line the ' + unit + ' up end to end with no gaps.',
        teach: 'Measuring means counting how many copies of one unit fit along the object.',
        explain: ['Each ' + unit + ' is one unit of length.', 'Count the ' + unit + ': ' + n + '.',
          'Length: <b>' + n + ' ' + unit + '</b>.'],
        b: -0.4
      });
    }
    if (mode === 1) {
      var a = n, b = other === n ? n + 1 : other;
      return I_choice('Which ' + item + ' is longer?', [a + ' ' + unit, b + ' ' + unit], a > b ? 0 : 1, {
        sub: 'Both were measured with the same ' + unit + '.',
        teach: 'With the same unit, the object that needs more units is longer.',
        explain: ['First ' + item + ': ' + a + ' ' + unit + '.', 'Second ' + item + ': ' + b + ' ' + unit + '.',
          a + (a > b ? ' > ' : ' < ') + b + ', so the ' + (a > b ? 'first' : 'second') + ' is longer.'],
        b: -0.2
      });
    }
    if (mode === 2) {
      return MC(rng, 'You measure a ' + item + ' with ' + unit + ' and get ' + n +
        '. Which unit gives a BIGGER number?', 'smaller ' + unit,
        ['bigger ' + unit, 'the same size ' + unit], {
        teach: 'A shorter unit must be repeated more times, so the measured number is larger.',
        explain: ['Small units fit many times along the object.', 'Big units fit fewer times.',
          'Using smaller ' + unit + ' gives a <b>bigger number</b>.'],
        b: 0.6
      });
    }
    if (mode === 3) {
      var gap = R.int(rng, 1, 3);
      return I_num('The ' + unit + ' were placed with a gap of ' + gap +
        ' ' + unit + ' in the middle, and you counted ' + n + ' total. How many ' + unit +
        ' actually cover the ' + item + '?', n - gap, {
        sub: 'Gaps are not part of the object.',
        teach: 'A correct measurement leaves no gaps or overlaps between units.',
        explain: ['Counted ' + unit + ': ' + n, 'Gap that should not be counted: ' + gap,
          n + ' − ' + gap + ' = <b>' + (n - gap) + '</b>'],
        b: 0.9
      });
    }
    var l1 = n, l2 = n + 1, l3 = Math.max(1, n - 1);
    return I_choice('Order these ' + unit + ' measurements from shortest to longest.',
      [l3 + ', ' + l1 + ', ' + l2, l2 + ', ' + l1 + ', ' + l3, l1 + ', ' + l3 + ', ' + l2], 0, {
      sub: 'Measurements: ' + l1 + ', ' + l2 + ', ' + l3 + ' ' + unit + '.',
      teach: 'Ordering measurements means comparing the numbers of the same unit.',
      explain: ['Numbers: ' + l1 + ', ' + l2 + ', ' + l3, 'From least to greatest: ' + Math.min(l1, l2, l3) +
        ', ' + [l1, l2, l3].sort(function (x, y) { return x - y; })[1] + ', ' + Math.max(l1, l2, l3),
        'Answer: <b>' + [l1, l2, l3].sort(function (x, y) { return x - y; }).join(', ') + '</b>'],
      b: 0.5
    });
  });

  /* ---------------------------------------------- K.MD.3 classify data ----- */
  G('k-md-classify', function (rng, lvl) {
    var cats = [['red', 'blue'], ['circles', 'squares'], ['animals', 'plants'], ['buttons', 'beads'],
      ['shells', 'stones'], ['cars', 'trucks']];
    var c = R.pick(rng, cats), mode = R.int(rng, 0, lvl <= 2 ? 2 : 4);
    var a = R.int(rng, lvl <= 2 ? 1 : 3, lvl <= 2 ? 6 : 11), b = R.int(rng, lvl <= 2 ? 1 : 3, lvl <= 2 ? 6 : 11);

    if (mode === 0) {
      return I_parts('Sort ' + (a + b) + ' objects into two groups.', [c[0], c[1]],
        [{ k: 'n', v: a }, { k: 'n', v: b }], {
        sub: 'Put a tally for each object in its group.',
        visual: V.bars([{ label: c[0], v: a }, { label: c[1], v: b }], {}),
        teach: 'Sorting into given categories and counting each group is the start of collecting data.',
        explain: ['Count the ' + c[0] + ' objects: ' + a, 'Count the ' + c[1] + ' objects: ' + b,
          'Check: ' + a + ' + ' + b + ' = ' + (a + b) + ' total ✓'],
        b: -0.3
      });
    }
    if (mode === 1) {
      return I_num('There are ' + a + ' ' + c[0] + ' and ' + b + ' ' + c[1] + '. How many objects in all?', a + b, {
        visual: V.bars([{ label: c[0], v: a }, { label: c[1], v: b }], {}),
        teach: 'The total is the sum of the two category counts.',
        explain: [c[0] + ': ' + a, c[1] + ': ' + b, a + ' + ' + b + ' = <b>' + (a + b) + '</b>'],
        b: -0.2
      });
    }
    if (mode === 2) {
      return I_cmp('Compare the groups: ' + a + ' ' + c[0] + ' and ' + b + ' ' + c[1] + '.', a, b, {
        visual: V.bars([{ label: c[0], v: a }, { label: c[1], v: b }], {}),
        teach: 'Comparing two category counts tells which group has more.',
        explain: [c[0] + ': ' + a, c[1] + ': ' + b, 'Compare ' + a + ' and ' + b + ' → ' + (a > b ? '>' : a < b ? '<' : '='),
          'There ' + (a > b ? 'are more ' + c[0] : a < b ? 'are more ' + c[1] : 'are the same number') + '.'],
        b: 0
      });
    }
    if (mode === 3) {
      var diff = Math.abs(a - b);
      return I_num('How many more ' + (a >= b ? c[0] : c[1]) + ' than ' + (a >= b ? c[1] : c[0]) + '?', diff, {
        visual: V.bars([{ label: c[0], v: a }, { label: c[1], v: b }], {}),
        teach: 'How many more is found by subtracting the smaller count from the larger count.',
        explain: ['Larger count: ' + Math.max(a, b), 'Smaller count: ' + Math.min(a, b),
          Math.max(a, b) + ' − ' + Math.min(a, b) + ' = <b>' + diff + '</b>'],
        b: 0.3
      });
    }
    var c3 = R.pick(rng, cats);
    return I_bool('If ' + (a + b) + ' objects are sorted into ' + c[0] + ' and ' + c[1] +
      ', can one group have ' + (a + b + 1) + ' objects?', false, {
      teach: 'The counts of the groups must add to the total, so no group can be bigger than the total.',
      explain: ['Total objects: ' + (a + b), 'A group of ' + (a + b + 1) + ' would need more objects than exist.',
        'So the answer is <b>No</b>.'],
      b: 0.5
    });
  });

  /* ------------------------------------------------ K.G.1-4 shapes --------- */
  G('k-g-shapes', function (rng, lvl) {
    var flat = [['circle', 'round and flat, no corners'], ['square', '4 equal sides and 4 corners'],
      ['triangle', '3 sides and 3 corners'], ['rectangle', '4 sides, 4 corners, opposite sides equal'],
      ['hexagon', '6 sides']];
    var solid = [['cube', '6 flat square faces'], ['sphere', 'completely round, rolls'],
      ['cylinder', '2 flat circular faces and rolls'], ['cone', '1 circular face and a point'],
      ['rectangular prism', '6 flat rectangular faces']];
    var mode = R.int(rng, 0, lvl <= 2 ? 2 : 5);
    var f = R.pick(rng, flat), s = R.pick(rng, solid);

    if (mode === 0) {
      return MC(rng, 'Which shape is described: "' + f[1] + '"?', f[0],
        [solid[0][0], solid[1][0], flat[(flat.indexOf(f) + 1) % flat.length][0]], {
        teach: 'Name a shape by its defining attributes: sides, corners, and whether it is flat.',
        explain: ['Clue: ' + f[1], 'That matches a ' + f[0] + '.', 'A ' + solid[0][0] + ' is solid, and the other flat shapes do not fit all the clues.'],
        b: -0.3
      });
    }
    if (mode === 1) {
      return MC(rng, 'Which one is a solid shape that ' + s[1] + '?', s[0],
        [f[0], flat[0][0], solid[(solid.indexOf(s) + 1) % solid.length][0]], {
        teach: 'Solid shapes live in 3 dimensions; flat shapes are only one flat surface.',
        explain: ['Clue: ' + s[1], 'That is a ' + s[0] + '.', 'Flat shapes like ' + f[0] + ' cannot roll the same way.'],
        b: -0.2
      });
    }
    if (mode === 2) {
      var sides = R.pick(rng, [3, 4, 6]);
      var name = sides === 3 ? 'triangle' : sides === 4 ? 'square' : 'hexagon';
      return I_num('How many sides does a ' + name + ' have?', sides, {
        teach: 'Counting sides and corners is how shapes are sorted into families.',
        explain: ['A ' + name + ' has ' + sides + ' sides.', 'Trace around to count them: ' + sides + '.',
          'Answer: <b>' + sides + '</b>'],
        b: 0
      });
    }
    if (mode === 3) {
      return I_bool('Two ' + f[0] + 's placed side by side can make a new, bigger shape.', true, {
        teach: 'Composing: putting shapes together makes a shape with new attributes.',
        explain: ['Put the two ' + f[0] + 's together along matching sides.', 'The new outline is a bigger shape.',
          'So <b>Yes</b>.'],
        b: 0.3
      });
    }
    if (mode === 4) {
      var need = R.pick(rng, [2, 4]);
      return I_num('How many small squares does it take to build a big square?', need === 2 ? 4 : 4, {
        sub: 'Use whole squares only, no cutting.',
        teach: 'A square needs equal sides, so small squares must fill both directions.',
        explain: ['One row of 2 squares is a rectangle, not a square.', 'Two rows of 2 squares make a square.',
          'Answer: <b>4</b>'],
        b: 0.6
      });
    }
    return I_bool('A ' + solid[0][0] + ' and a ' + f[0] + ' are both flat shapes.', false, {
      teach: 'A solid shape takes up space; a flat shape has only a flat surface.',
      explain: ['A ' + solid[0][0] + ' is solid.', 'A ' + f[0] + ' is flat.', 'They are not both flat → <b>No</b>.'],
      b: 0.4
    });
  });
})();

</script>
<script>
/* =============================================================================
 * 20-ui.js — MathPath browser UI. Renders items, models, feedback, plan,
 * ladder, report and the placement probe. Depends on 00-core, 01-skills,
 * 02-engine (window.MathPath) and the generators. No dependencies, no network.
 * ============================================================================= */
(function (root) {
  'use strict';

  var doc = document, win = root, NS = 'http://www.w3.org/2000/svg';
  var M = root.MathPath;                       // engine API (02-engine.js)
  var checkSpec = root.checkSpec, diagnose = root.diagnose;
  var nfmt = root.nfmt, answerTextFor = root.answerTextFor;

  /* ------------------------------------------------------------ dom ------- */
  function h(tag, props, kids) {
    var n = doc.createElement(tag), k;
    if (props) for (k in props) {
      if (!props.hasOwnProperty(k)) continue;
      var v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = String(v);
      else if (k === 'html') n.innerHTML = String(v);          // trusted: our own strings
      else if (k === 'style') { for (var st in v) if (v.hasOwnProperty(st)) n.style[st] = v[st]; }
      else if (k === 'on') { for (var ev in v) if (v.hasOwnProperty(ev)) n.addEventListener(ev, v[ev]); }
      else if (k === 'value') n.value = v;
      else if (k === 'disabled') n.setAttribute('disabled', '');
      else n.setAttribute(k, v);
    }
    add(n, kids);
    return n;
  }
  function s(tag, attrs, kids) {
    var n = doc.createElementNS(NS, tag), k;
    if (attrs) for (k in attrs) if (attrs.hasOwnProperty(k) && attrs[k] != null) n.setAttribute(k, String(attrs[k]));
    add(n, kids);
    return n;
  }
  function add(n, kids) {
    if (kids == null || kids === false || kids === '') return n;
    if (Object.prototype.toString.call(kids) === '[object Array]') {
      for (var i = 0; i < kids.length; i++) add(n, kids[i]);
      return n;
    }
    if (typeof kids === 'number') kids = String(kids);
    if (typeof kids === 'string') { n.appendChild(doc.createTextNode(kids)); return n; }
    if (kids.nodeType) n.appendChild(kids);
    return n;
  }
  function clear(n) { while (n && n.firstChild) n.removeChild(n.firstChild); return n; }
  function $(sel, ctx) { return (ctx || doc).querySelector(sel); }
  function esc(x) {
    return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }

  /* ------------------------------------------------------------- state ---- */
  var E = null;
  var S = {
    view: 'practice', item: null, queue: [], attempts: 0, answered: false, revealed: false,
    picked: null, notes: [], manual: null, lastRec: null, reteachDone: false, diagReport: null
  };

  /* --------------------------------------------------------- visuals ------ */
  var PAL = ['#4f46e5', '#0ea5e9', '#f59e0b', '#10b981', '#ef4444', '#8b5cf6', '#14b8a6', '#f97316'];

  function caption(t) { return t ? h('div', { class: 'cap', text: String(t) }) : null; }

  var DRAW = {
    /* ten-frame(s) with n counters */
    tenframe: function (v) {
      var frames = clamp(v.frames || Math.max(1, Math.ceil((v.n || 0) / 10)), 1, 4);
      var left = Math.max(0, Math.min(v.n || 0, frames * 10));
      var wrap = h('div', { class: 'tf' });
      for (var f = 0; f < frames; f++) {
        var fr = h('div', { class: 'frame' });
        for (var i = 0; i < 10; i++) {
          var idx = f * 10 + i;
          fr.appendChild(h('div', { class: 'cell' + (idx < left ? ' on' : '') }));
        }
        wrap.appendChild(fr);
      }
      return h('div', { class: 'viz' }, [wrap, caption(v.label)]);
    },
    /* number line with ticks and optional marks */
    numline: function (v) {
      var min = +v.min || 0, max = +v.max || 10, marks = v.marks || [], o = v.opts || {};
      var W = clamp((max - min) * 34 + 60, 240, 620), H = 74, x0 = 30, x1 = W - 24, y = 40;
      var X = function (t) { return x0 + (x1 - x0) * ((t - min) / ((max - min) || 1)); };
      var g = [s('line', { x1: x0 - 8, y1: y, x2: x1 + 8, y2: y, class: 'ax' })];
      var span = max - min, step = span <= 1 ? (span <= 0.2 ? 0.1 : 0.2) : (span <= 12 ? 1 : (span <= 30 ? 5 : (span <= 120 ? 10 : Math.ceil(span / 10 / 50) * 50)));
      for (var t = Math.ceil(min / step) * step; t <= max + 1e-9; t += step) {
        var px = X(t);
        var major = Math.abs(t / (step * (span <= 12 ? 1 : 5)) - Math.round(t / (step * (span <= 12 ? 1 : 5)))) < 1e-9;
        g.push(s('line', { x1: px, y1: y - (major ? 7 : 4), x2: px, y2: y + (major ? 7 : 4), class: 'ax' }));
        if (major || span <= 12) g.push(s('text', { x: px, y: y + 22, 'text-anchor': 'middle', class: 'lbl' }, nfmt(+t.toFixed(4))));
      }
      marks.forEach(function (mk) {
        if (!mk || mk.x == null) return;
        var px = X(+mk.x);
        if (mk.arrow) {
          g.push(s('path', { d: 'M' + px + ' ' + (y - 12) + ' l-5 -9 l10 0 z', fill: 'currentColor', opacity: .8 }));
        } else {
          g.push(s('circle', { cx: px, cy: y, r: 5, class: 'pt' }));
        }
        if (mk.label != null) g.push(s('text', { x: px, y: y - 24, 'text-anchor': 'middle' }, String(mk.label)));
      });
      return h('div', { class: 'viz' }, [s('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H }, g), caption(o.label)]);
    },
    /* dot array */
    array: function (v) {
      var rows = clamp(Math.round(v.rows || 1), 1, 12), cols = clamp(Math.round(v.cols || 1), 1, 20);
      var grid = h('div', { class: 'dots', style: { gridTemplateColumns: 'repeat(' + cols + ', 15px)' } });
      for (var i = 0; i < rows * cols; i++) grid.appendChild(h('div', { class: 'd' }));
      return h('div', { class: 'viz' }, [grid, caption((v.opts || {}).label)]);
    },
    /* fraction strips */
    frac: function (v) {
      var bars = v.bars || [];
      var kids = bars.map(function (b) {
        var d = clamp(Math.round(b.d || 1), 1, 12), n = clamp(Math.round(b.n || 0), 0, d * 3);
        var segs = [];
        for (var i = 0; i < d; i++) segs.push(h('div', { class: 'seg' + (i < n ? ' on' : '') }));
        return h('div', { class: 'fracbar' }, [h('div', { class: 'strip' }, segs), b.label ? h('div', { class: 'lab', text: String(b.label) }) : null]);
      });
      return h('div', { class: 'viz' }, kids);
    },
    /* tape diagram / bar model */
    bar: function (v) {
      var parts = (v.parts || []).slice(0, 8);
      var tot = parts.reduce(function (a, p) { return a + Math.abs(+p.v || 0); }, 0) || 1;
      var segs = parts.map(function (p, i) {
        var w = Math.abs(+p.v || 0) / tot * 100;
        return h('div', {
          class: 'seg', style: { width: w.toFixed(2) + '%', background: PAL[i % PAL.length] },
          text: (p.label != null ? p.label : '') + (p.v != null && String(p.label || '').indexOf(String(p.v)) < 0 ? ' ' + nfmt(+p.v || 0) : '')
        });
      });
      return h('div', { class: 'viz' }, [h('div', { class: 'tape' }, segs), caption((v.opts || {}).label)]);
    },
    /* unit-square array for area */
    area: function (v) {
      var rows = clamp(Math.round(v.rows || 1), 1, 12), cols = clamp(Math.round(v.cols || 1), 1, 16);
      var g = h('div', { class: 'areagrid', style: { gridTemplateColumns: 'repeat(' + cols + ', 24px)' } });
      for (var i = 0; i < rows * cols; i++) g.appendChild(h('div', { class: 'sq' }));
      var lab = (v.opts || {}).label || (rows + ' × ' + cols + ' = ' + (rows * cols));
      return h('div', { class: 'viz' }, [g, caption(lab)]);
    },
    /* base-ten blocks */
    blocks: function (v) {
      var grp = function (cls, n) {
        var g = h('div', { class: 'grp' });
        for (var i = 0; i < Math.min(n || 0, 10); i++) g.appendChild(h('div', { class: cls }));
        return n > 10 ? h('div', { class: 'grp' }, [g, h('span', { class: 'tiny', text: '×' + n })]) : g;
      };
      var kids = [];
      if (v.hundreds) kids.push(grp('flat', v.hundreds));
      if (v.tens) kids.push(grp('rod', v.tens));
      if (v.ones) kids.push(grp('cube', v.ones));
      if (!kids.length) kids.push(grp('cube', 0));
      return h('div', { class: 'viz' }, [h('div', { class: 'blk' }, kids), caption((v.hundreds || 0) * 100 + (v.tens || 0) * 10 + (v.ones || 0))]);
    },
    /* analog clock */
    clock: function (v) {
      var hh = ((v.h || 0) % 12 + 12) % 12, mm = clamp(v.m || 0, 0, 59), R = 52, C = 60;
      var g = [s('circle', { cx: C, cy: C, r: R, fill: 'none', stroke: 'currentColor', 'stroke-width': 2 })];
      for (var i = 0; i < 12; i++) {
        var a = i * Math.PI / 6;
        g.push(s('line', {
          x1: C + Math.sin(a) * (R - 6), y1: C - Math.cos(a) * (R - 6),
          x2: C + Math.sin(a) * (R - 1), y2: C - Math.cos(a) * (R - 1), class: 'ax'
        }));
      }
      var ha = ((hh + mm / 60) % 12) * Math.PI / 6, ma = mm * Math.PI / 30;
      g.push(s('line', { x1: C, y1: C, x2: C + Math.sin(ha) * 26, y2: C - Math.cos(ha) * 26, stroke: 'currentColor', 'stroke-width': 4, 'stroke-linecap': 'round' }));
      g.push(s('line', { x1: C, y1: C, x2: C + Math.sin(ma) * 40, y2: C - Math.cos(ma) * 40, stroke: 'var(--accent)', 'stroke-width': 2.6, 'stroke-linecap': 'round' }));
      g.push(s('circle', { cx: C, cy: C, r: 3.4, fill: 'currentColor' }));
      var label = (v.opts && v.opts.label) || (hh + ':' + ('0' + mm).slice(-2));
      return h('div', { class: 'viz' }, [s('svg', { viewBox: '0 0 120 120', width: 150, height: 150 }, g), caption(label)]);
    },
    /* coins */
    coins: function (v) {
      var defs = [['q', '25¢', 25, '#b8b8c4'], ['d', '10¢', 10, '#c9ccd2'], ['n', '5¢', 5, '#c08a5a'], ['p', '1¢', 1, '#d9a066']];
      var kids = defs.filter(function (d) { return (v[d[0]] || 0) > 0; }).map(function (d) {
        var pile = h('div', { class: 'pile' });
        for (var i = 0; i < Math.min(v[d[0]], 12); i++) pile.appendChild(h('div', { class: 'coin', style: { background: d[3], marginBottom: '-22px' } }, d[1]));
        pile.appendChild(h('div', { class: 'cnt', text: v[d[0]] + ' × ' + d[1] }));
        return pile;
      });
      if (!kids.length) kids.push(h('div', { class: 'tiny', text: 'no coins' }));
      var tot = (v.q || 0) * 25 + (v.d || 0) * 10 + (v.n || 0) * 5 + (v.p || 0);
      return h('div', { class: 'viz' }, [h('div', { class: 'coins' }, kids), caption(tot + '¢ = $' + (tot / 100).toFixed(2))]);

        if (o.rowLabels && o.rowLabels[r] != null) tr.appendChild(h('th', { text: String(o.rowLabels[r]) }));
        for (var c = 0; c < cols; c++) {
          var val = cells ? (cells[r] ? cells[r][c] : '') : (o.rowLabels && o.rowLabels[r] != null && o.colLabels && o.colLabels[c] != null ? (+o.rowLabels[r] * +o.colLabels[c]) : '');
          tr.appendChild(h('td', { text: String(val == null ? '' : val) }));
        }
        t.appendChild(tr);
      }

        tr2.appendChild(h('td', { text: '' }));

  function renderVisual(v) {
    if (!v || !v.k) return null;
    var fn = DRAW[v.k] || DRAW.table && v.k === 'table';
    try {
      if (DRAW[v.k]) return DRAW[v.k](v);

    } catch (e) { return null; }
  }

  /* ------------------------------------------------------- answer inputs -- */
  function answerKind(item) {
    var t = item.type || 'text', k = item.spec && item.spec.k;
    if (t === 'choice' || k === 'bool') return 'choice';
    if (t === 'compare' || k === 'cmp') return 'compare';
    if (t === 'multi' || k === 'list') return 'multi';
    if (k === 'point' || k === 'points') return 'text';
    return 'text';
  }
  function bandOf(item) { var sk = root.SKILL_BY_ID[item.skill]; return sk ? sk.band : ''; }
  function needsKeypad(item) {
    var b = bandOf(item);
    return (b === 'K' || b === '1' || b === '2' || b === '3') && answerKind(item) !== 'choice';
  }

  function buildAnswer(item) {
    var kind = answerKind(item);
    if (kind === 'choice') {
      var opts = item.choices && item.choices.length ? item.choices : ['Yes', 'No'];

      });
      return box;
    }
    if (kind === 'compare') {
      var box2 = h('div', { class: 'opts', style: { gridTemplateColumns: 'repeat(3, 1fr)' } });
      (item.choices && item.choices.length ? item.choices : ['<', '>', '=']).forEach(function (c, i) {
        box2.appendChild(h('button', {
          class: 'opt sym', type: 'button', 'data-i': i,

        }, [h('span', { text: String(c) })]));
      });
      return box2;
    }
    if (kind === 'multi') {
      var labels = item.labels || (item.spec.vals || []).map(function (_, i) { return 'Part ' + (i + 1); });
      var wrap = h('div', { class: 'parts' });
      labels.forEach(function (L, i) {
        wrap.appendChild(h('div', { class: 'part' }, [
          h('label', { text: String(L) }),

        ]));
      });
      return wrap;
    }
    /* text */
    var ph = { point: '(x, y)', points: '(x, y)  (x, y)', interval: '[low, high]', ratio: 'a : b', expr: 'type an expression', frac: 'e.g. 3/4', str: 'type your answer' }[item.spec.k] || '';
    var inp = h('input', {
      class: 'fld', type: 'text', id: 'ans', placeholder: ph, autocomplete: 'off',

    });
    var kids = [h('div', { class: 'row', style: { alignItems: 'stretch' } }, [
      h('div', { class: 'grow' }, [inp]),
      item.unit ? h('div', { class: 'unit', text: String(item.unit) }) : null
    ])];
    if (needsKeypad(item)) kids.push(keypad(inp));
    return h('div', {}, kids);
  }
  function keypad(inp) {
    var keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '/', '.', '-', '+', '=', '⌫'];
    var kp = h('div', { class: 'keypad' });
    keys.forEach(function (k) {
      kp.appendChild(h('button', {
        type: 'button', text: k, on: {
          click: function () {
            var v = String(inp.value || '');
            inp.value = k === '⌫' ? v.slice(0, -1) : v + k;
            inp.focus();
            S.picked = null;
          }
        }
      }));
    });
    return kp;
  }

  /* ----------------------------------------------------------- item card -- */
  function currentRaw() {
    var kind = answerKind(S.item || {});
    if (kind === 'choice' || kind === 'compare') {
      if (S.picked == null) return '';
      var cs = S.item.choices && S.item.choices.length ? S.item.choices : ['Yes', 'No'];
      return String(cs[S.picked]);
    }
    if (kind === 'multi') {
      var parts = $$('#view .part input');
      var vals = parts.map(function (i) { return String(i.value || '').trim(); });
      if (!vals.join('')) return '';
      return vals.join(', ');
    }
    var el = $('#view #ans');
    return el ? String(el.value || '').trim() : '';

    var out = [], nl = (ctx || doc).querySelectorAll(sel);

    return out;
  }

  function renderItem() {
    var item = S.item, view = $('#itemhost') || $('#view');

    var sk = root.SKILL_BY_ID[item.skill] || { name: item.skill, code: '', band: '' };

    var card = h('div', { class: 'card', id: 'card' }, [
      h('div', { class: 'skillhead' }, [

        h('span', { class: 'code', text: (sk.code || '') + (sk.band ? ' · ' + (E.BAND_LABEL[sk.band] || sk.band) : '') }),
        whyChip, lv
      ]),

      h('div', { class: 'prompt' + ((sk.band === 'K' || sk.band === '1') ? ' big' : ''), html: esc(item.prompt) }),

    clear(view).appendChild(card);

    if (inp && !S.answered) setTimeout(function () { try { inp.focus(); } catch (e) { } }, 30);
  }

  function renderActions() {
    var box = $('#view #actions'); if (!box) return;
    clear(box);
    var raw = currentRaw();
    if (!S.answered) {
      box.appendChild(h('button', { class: 'btn primary', type: 'button', on: { click: submit } }, 'Check answer'));
      box.appendChild(h('button', {
        class: 'btn ghost', type: 'button', on: {
          click: function () {
            var fb = $('#view #feedback'); if (!fb) return;
            var hb = $('#view .hintbox');
            if (hb) { clear(fb); return; }
            clear(fb).appendChild(h('div', { class: 'hintbox', html: esc(S.item.hint || S.item.teach || '') }));
          }
        }
      }, 'Hint'));
      box.appendChild(h('div', { class: 'grow' }));
      box.appendChild(h('button', { class: 'btn ghost', type: 'button', on: { click: function () { finish(false, true); } } }, 'Skip'));
    } else {
      var wrong = S.lastRec && !S.lastRec.ok;
      if (wrong && !S.reteachDone && !S.item.diag) {
        box.appendChild(h('button', {
          class: 'btn primary', type: 'button', on: { click: startReteach }
        }, 'Try an easier one'));
        box.appendChild(h('button', { class: 'btn', type: 'button', on: { click: next } }, 'Next skill'));
      } else {
        box.appendChild(h('button', { class: 'btn primary', type: 'button', on: { click: next } }, S.item.diag ? 'Next probe' : 'Next'));
      }
      box.appendChild(h('div', { class: 'grow' }));
      box.appendChild(h('button', {
        class: 'btn ghost', type: 'button', on: {
          click: function () {
            var fb = $('#view #feedback'); if (!fb) return;

  function pick(i) {
    if (S.answered) return;

      b.classList[+b.getAttribute('data-i') === i ? 'add' : 'remove']('sel');
    });
    renderActions();
  }

  function submit() {
    if (S.answered) return;
    var raw = currentRaw();
    if (!raw) { toast('Type or pick your answer first'); return; }
    var res = checkSpec(S.item.spec, raw);
    if (res.ok) { finish(true); return; }
    S.attempts++;
    var notes = diagnose(S.item, raw) || [];
    S.notes = notes;
    var fb = $('#view #feedback');
    var kind = answerKind(S.item);
    if (kind === 'choice' || kind === 'compare') {
      $$('#view .opt').forEach(function (b) { if (+b.getAttribute('data-i') === S.picked) b.classList.add('no'); });
    } else {
      $$('#view input.fld').forEach(function (i) { i.classList.add('no'); });
    }

    clear(fb).appendChild(h('div', { class: 'fb no' }, [
      h('div', { class: 'head' }, ['Not yet — try again']),
      notes.length ? h('div', { class: 'note', html: esc(notes[0]) }) : h('div', { class: 'note', text: 'Check the last step: what did you do to the numbers?' })
    ]));
    S.picked = null;
    $$('#view .opt').forEach(function (b) { b.classList.remove('sel'); });
    renderActions();

  function finish(ok, skipped) {

    S.answered = true;
    S.revealed = true;
    var rec;
    if (S.item.diag) {
      rec = { p: E.prob(S.item.b), status: E.statusOf(S.item.skill) };
      var done = null;
      try { done = E.diagAnswer(S.item, ok); } catch (e) { done = null; }
      if (done) S.diagReport = done;
    } else {
      rec = E.record(S.item, ok);
    }
    rec.ok = ok; rec.skipped = !!skipped;
    S.lastRec = rec;
    E.save();
    beep(ok);
    revealAnswer();
    renderActions();
    renderHeader();

  function revealAnswer() {
    var fb = $('#view #feedback'); if (!fb || !S.item) return;

    }

    clear(fb).appendChild(h('div', { class: 'fb ' + (ok ? 'ok' : 'no') }, [

      h('div', { class: 'ans-line', html: 'Answer: <b>' + esc(item.answerText || answerTextFor(item.spec)) + '</b>' + (item.unit ? ' ' + esc(item.unit) : '') }),

      h('ol', { class: 'steps', id: 'steps' }, (item.explain || []).map(function (st) { return h('li', { html: st }); })),
      item.teach ? h('div', { class: 'teach', html: esc(item.teach) }) : null
    ]));

    S.queue = retries.slice(0, 2);

  }

  /* --------------------------------------------------------------- queue -- */
  function next() {
    S.attempts = 0; S.answered = false; S.revealed = false; S.picked = null;

    if (S.queue.length) { S.item = S.queue.shift(); renderItem(); renderHeader(); return; }
    var opts = S.manual ? { skillId: S.manual, why: 'manual' } : null;
    var guard = 0, item = null;
    while (guard++ < 12 && !item) {

        log.length ? spark : h('div', { class: 'muted', text: 'Answer something to see your trace.' })
      ]),
      h('div', { class: 'card' }, [
        h('h2', { text: 'Mastery by band' }),
        h('div', { class: 'bars', style: { marginTop: '10px' } }, p.bands.map(function (b) {
          var g = p.byBand[b] || {};
          var pct = g.n ? Math.round((g.mast || 0) / g.n * 100) : 0;
          return h('div', { class: 'barrow' }, [
            h('div', { text: E.BAND_LABEL[b] || b }),
            h('div', { class: 'track' }, [h('div', { class: 'fill', style: { width: pct + '%' } })]),
            h('div', { class: 'val', text: pct + '%' })
          ]);
        }))
      ]),
      h('div', { class: 'card' }, [
        h('h2', { text: 'Settings' }),
        h('div', { class: 'stack', style: { marginTop: '10px' } }, [
          toggle('Auto-advance after each item', 'autoNext'),
          toggle('Show the worked steps after answering', 'showSteps'),
          toggle('Sound effects', 'sound')
        ]),
        h('hr', { class: 'sep' }),
        h('div', { class: 'row' }, [
          h('button', { class: 'btn small', type: 'button', on: { click: exportData } }, 'Export progress'),
          h('button', { class: 'btn small', type: 'button', on: { click: importData } }, 'Import progress'),
          h('div', { class: 'grow' }),
          h('button', { class: 'btn small danger', type: 'button', on: { click: resetAll } }, 'Reset everything')
        ]),
        h('div', { class: 'tiny', style: { marginTop: '8px' }, text: 'Everything lives in this browser only (localStorage key mathpath.v1). No network calls, ever.' })
      ])
    ]));
  }
  function toggle(label, key) {
    var on = !!(E.st.settings && E.st.settings[key]);
    return h('button', {
      class: 'opt', type: 'button', on: {
        click: function () {
          E.st.settings[key] = !on; E.save(); render();
        }
      }
    }, [h('span', { class: 'grow', text: label }), h('span', { class: 'pill ' + (on ? 'good' : ''), text: on ? 'on' : 'off' })]);
  }
  function exportData() {
    try {
      var txt = E.exportJSON();
      var blob = new Blob([txt], { type: 'application/json' });
      var a = doc.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'mathpath-progress.json';
      doc.body.appendChild(a); a.click();
      setTimeout(function () { doc.body.removeChild(a); }, 200);
      toast('Progress downloaded');
    } catch (e) { toast('Export failed'); }
  }
  function importData() {
    var inp = doc.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var fr = new FileReader();
      fr.onload = function () {
        try { E.importJSON(String(fr.result)); E.save(); toast('Progress imported'); location.reload(); }
        catch (e) { toast('Could not read that file'); }
      };
      fr.readAsText(f);
    };
    inp.click();
  }
  function resetAll() {
    if (!win.confirm('Erase all progress on this device?')) return;
    try { localStorage.removeItem('mathpath.v1'); } catch (e) { }
    location.reload();
  }

  function viewDiag() {
    var view = $('#view');
    if (S.diagReport) {
      var p = S.diagReport;
      clear(view).appendChild(h('div', { class: 'card' }, [
        h('h2', { text: 'Placement result' }),
        h('div', { class: 'muted', html: 'You are working at <b>' + esc(p.bandLabel || '') + '</b> (ladder position ' + nfmt(p.theta) + '). Start here:' }),
        h('div', { class: 'skill-list', style: { marginTop: '12px' } }, (p.plan || []).slice(0, 5).map(function (row) {
          return h('div', { class: 'skill' }, [
            h('div', { class: 'grow' }, [h('div', { class: 'nm', text: row.sk.name }), h('div', { class: 'cd', text: row.sk.code })]),
            h('span', { class: 'pill', text: row.kind }),
            h('button', {
              class: 'btn small', type: 'button', disabled: !root.SKILL_GEN[row.sk.id],
              on: { click: function () { S.manual = row.sk.id; S.diagReport = null; S.view = 'practice'; S.item = null; render(); } }
            }, root.SKILL_GEN[row.sk.id] ? 'Start' : 'no items')
          ]);
        })),
        h('div', { class: 'row', style: { marginTop: '14px' } }, [
          h('button', { class: 'btn primary', type: 'button', on: { click: function () { S.diagReport = null; S.view = 'plan'; render(); } } }, 'See my full plan'),
          h('button', { class: 'btn ghost', type: 'button', on: { click: function () { S.diagReport = null; startDiag(); } } }, 'Run it again')
        ])
      ]));
      return;
    }
    if (!E.diagActive()) {
      clear(view).appendChild(h('div', { class: 'card' }, [
        h('h2', { text: 'Placement probe' }),
        h('div', { class: 'muted', text: 'About 20 questions that bracket the ladder by bisection, then refine around the point where accuracy drops. It sets your starting band and finds prerequisite gaps.' }),
        h('div', { class: 'row', style: { marginTop: '14px' } }, [
          h('button', { class: 'btn primary', type: 'button', on: { click: startDiag } }, 'Start the probe'),
          h('button', { class: 'btn ghost', type: 'button', on: { click: function () { S.view = 'practice'; render(); } } }, 'Just start practicing')
        ])
      ]));
      return;
    }
    if (!S.item) { try { S.item = E.diagNext(); } catch (e) { S.item = null; } }
    var D = E.st.diag || { asked: 0, limit: 20 };
    clear(view).appendChild(h('div', {}, [
      h('div', { class: 'card tight' }, [
        h('div', { class: 'row between' }, [h('b', { text: 'Placement probe' }), h('span', { class: 'tiny', text: (D.asked || 0) + ' / ' + (D.limit || 20) })]),
        h('div', { class: 'diagbar' }, [h('i', { style: { width: Math.round((D.asked || 0) / (D.limit || 20) * 100) + '%' } })])
      ]),
      h('div', { id: 'itemhost' })
    ]));
    renderItem();
  }
  function startDiag() {
    S.diagReport = null; S.queue = []; S.attempts = 0; S.answered = false; S.revealed = false; S.lastRec = null;
    var it = null;
    try { it = E.diagStart(); } catch (e) { it = null; }
    S.item = it;
    S.view = 'diag';
    render();
  }

  /* -------------------------------------------------------------- header -- */
  function renderHeader() {
    var bar = $('#bar'); if (!bar) return;
    var st = E.st, p = E.placement();
    var acc = st.sess.asked ? Math.round(st.sess.correct / st.sess.asked * 100) : 0;
    clear(bar).appendChild(h('div', { class: 'bar-in' }, [
      h('div', { class: 'brand' }, [h('div', { class: 'glyph', text: 'π' }), 'MathPath']),
      h('div', { class: 'meter' }, [
        h('span', { class: 'pill accent', text: p.bandLabel || 'start' }),
        st.sess.streak ? h('span', { class: 'pill good', text: '🔥 ' + st.sess.streak }) : null,
        st.sess.asked ? h('span', { class: 'pill', text: acc + '%' }) : null
      ]),
      h('nav', { class: 'tabs' }, [
        tab('practice', 'Practice'), tab('plan', 'Plan'), tab('ladder', 'Ladder'), tab('report', 'Report'),
        h('button', { type: 'button', class: S.view === 'diag' ? 'on' : '', on: { click: function () { location.hash = '#diag'; } }, text: E.diagActive() ? 'Probe ●' : 'Probe' })
      ])
    ]));
  }
  function tab(name, label) {
    return h('button', {
      type: 'button', class: S.view === name ? 'on' : '', text: label,
      on: { click: function () { location.hash = '#' + name; } }
    });
  }

  /* -------------------------------------------------------------- render - */
  function render() {
    renderHeader();
    if (S.view === 'plan') viewPlan();
    else if (S.view === 'ladder') viewLadder();
    else if (S.view === 'report') viewReport();
    else if (S.view === 'diag') viewDiag();
    else viewPractice();
  }

  function route() {
    var v = (location.hash || '#practice').replace(/^#\/?/, '') || 'practice';
    if (v.indexOf('practice/') === 0) { S.manual = v.slice(9); S.item = null; S.queue = []; v = 'practice'; }
    if (['practice', 'plan', 'ladder', 'report', 'diag'].indexOf(v) < 0) v = 'practice';
    if (v !== S.view) { S.view = v; }
    render();
  }

  /* --------------------------------------------------------------- sound - */
  var AC = null;
  function beep(ok) {
    if (!E || !E.st.settings || !E.st.settings.sound) return;
    try {
      AC = AC || new (win.AudioContext || win.webkitAudioContext)();
      var o = AC.createOscillator(), g = AC.createGain();
      o.type = 'sine'; o.frequency.value = ok ? 660 : 220;
      g.gain.value = 0.05; o.connect(g); g.connect(AC.destination);
      o.start(); o.frequency.exponentialRampToValueAtTime(ok ? 990 : 160, AC.currentTime + 0.12);
      setTimeout(function () { o.stop(); }, 150);
    } catch (e) { }
  }
  var toastT = null;
  function toast(msg) {
    var t = $('#toast'); if (!t) return;
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(function () { t.classList.remove('on'); }, 2200);
  }

  /* ------------------------------------------------------------ keyboard - */
  function keys(ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var tag = (ev.target && ev.target.tagName || '').toLowerCase();
    if (S.view !== 'practice' && S.view !== 'diag') return;
    if (ev.key === 'Enter') {
      ev.preventDefault();
      if (!S.answered) { if (currentRaw()) submit(); } else next();
      return;
    }
    if (!S.answered && /^[1-6]$/.test(ev.key) && (answerKind(S.item || {}) === 'choice' || answerKind(S.item || {}) === 'compare')) {
      var i = +ev.key - 1, cs = (S.item && S.item.choices) || [];
      if (i < cs.length) { ev.preventDefault(); pick(i); }
      return;
    }
    if ((ev.key === 'h' || ev.key === 'H') && !S.answered && tag !== 'input') {
      var hb = $('#view .hintbox');
      if (!hb) add($('#view #feedback') || $('#view'), h('div', { class: 'hintbox', html: esc((S.item && (S.item.hint || S.item.teach)) || '') }));
    }
  }

  /* ---------------------------------------------------------------- boot -- */
  function boot() {
    if (!M || !M.createEngine) {
      var v0 = $('#view');
      if (v0) clear(v0).appendChild(h('div', { class: 'card' }, [h('h2', { text: 'Engine failed to load' }), h('div', { class: 'muted', text: 'MathPath.createEngine is missing — the script order in this file is wrong.' })]));
      return;
    }
    var state = null;
    try { state = M.load ? M.load() : null; } catch (e) { state = null; }
    if (!state) { try { state = M.blankState(); } catch (e) { state = null; } }
    E = M.createEngine({ state: state, rng: Math.random });
    if (!E.st.settings) E.st.settings = { autoNext: true, sound: false, reviewShare: 0.22 };
    win.addEventListener('hashchange', route);
    doc.addEventListener('keydown', keys);
    route();
  }

  root.MathPathUI = {
    boot: boot, render: render, renderVisual: renderVisual, buildAnswer: buildAnswer,
    DRAW: DRAW, state: S, engine: function () { return E; }, toast: toast
  };

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot);
  else boot();
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
  var v = document.getElementById('view');
  if (!window.MathPathUI) {
    v.innerHTML = '<div class="card"><h2>The interface did not load</h2><p class="muted">' +
      'window.MathPathUI is missing — this HTML file was assembled in the wrong order or truncated.</p></div>';
    return;
  }
  if (window.MathPathUI.state) window.MathPathUI.boot();
})();
</script>
</body>
</html>
